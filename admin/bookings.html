<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>All Bookings — Admin Console</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="app-container header-inner">
      <a href="/admin/index.html" class="brand-logo">
        <div class="brand-icon" style="background: #1e40af;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <span>TourGuide</span>
        <span class="brand-badge" style="color: #1e40af;" data-i18n="brand.adminBadge">ADMIN</span>
      </a>

      <nav class="nav-links">
        <a href="/admin/index.html" class="nav-link" data-i18n="nav.dashboard">Dashboard</a>
        <a href="/admin/guides.html" class="nav-link" data-i18n="nav.guides">Guides & Verification</a>
        <a href="/admin/bookings.html" class="nav-link active" data-i18n="nav.bookings">Bookings</a>
        <a href="/admin/users.html" class="nav-link" data-i18n="nav.users">Users</a>
        <a href="/admin/payments.html" class="nav-link" data-i18n="nav.payments">Payments</a>
        <a href="/admin/reports.html" class="nav-link" data-i18n="nav.reports">Reports</a>
      </nav>

      <div class="header-actions"></div>
    </div>
  </header>

  <main class="main-content">
    <div class="app-container">

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6);">
        <h1 style="font-size: 1.5rem; font-weight: 800;" data-i18n="admin.allBookingsTitle">Marketplace Bookings Pipeline</h1>
      </div>

      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th data-i18n="admin.bookingIdCol">Booking ID</th>
              <th data-i18n="admin.typeCol">Type</th>
              <th data-i18n="admin.touristCol">Tourist</th>
              <th data-i18n="admin.guideCol">Guide</th>
              <th data-i18n="admin.locationCol">Location</th>
              <th data-i18n="admin.dateTimeCol">Date & Time</th>
              <th data-i18n="admin.durationCol">Duration</th>
              <th data-i18n="admin.totalCol">Total</th>
              <th data-i18n="admin.feeCol">Commission (15%)</th>
              <th data-i18n="admin.statusCol">Status</th>
              <th data-i18n="admin.actionCol">Action</th>
            </tr>
          </thead>
          <tbody id="allBookingsTbody"></tbody>
        </table>
      </div>

    </div>
  </main>

  <script type="module">
    import { db, COLLECTIONS } from '/js/firebase.js';
    import { enforceRouteProtection, onAuthReady } from '/js/auth.js';
    import { t, getLocalizedStatus, formatCurrency, formatDuration, formatBookingDateTime } from '/js/utils.js';

    enforceRouteProtection({ allowedRoles: ['admin'] });

    async function loadAllBookings() {
      const bookings = await db.getCollection(COLLECTIONS.BOOKINGS);
      const sorted = [...bookings].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
      const tbody = document.getElementById('allBookingsTbody');

      tbody.innerHTML = sorted.map(b => {
        const bType = b.bookingType || b.type || 'instant';
        const cur = b.currency || 'USD';
        return `
          <tr>
            <td style="font-family: monospace; font-weight: 700;">${b.id}</td>
            <td><span class="badge badge-gray">${bType === 'instant' ? t('booking.instantType') : t('booking.scheduledType')}</span></td>
            <td>${b.touristName || ''}</td>
            <td>${b.guideName || ''}</td>
            <td>${b.location || ''}</td>
            <td>${formatBookingDateTime(b.date, b.startTime, b.endTime)}</td>
            <td>${formatDuration(b.duration)}</td>
            <td style="font-weight: 700;">${formatCurrency(Number(b.total || 0).toFixed(2), cur)}</td>
            <td style="color: var(--success); font-weight: 700;">${formatCurrency(Number(b.platformFee || 0).toFixed(2), cur)}</td>
            <td><span class="badge ${b.status === 'completed' ? 'badge-gray' : ['cancelled', 'rejected', 'disputed'].includes(b.status) ? 'badge-error' : 'badge-online'}">${getLocalizedStatus(b.status)}</span></td>
            <td>
              <a href="/tourist/booking.html?id=${b.id}" class="btn btn-outline btn-sm">${t('admin.inspectRide')}</a>
            </td>
          </tr>
        `;
      }).join('');
    }

    document.addEventListener('tourguide:langchange', loadAllBookings);
    onAuthReady((user) => {
      if (user) loadAllBookings();
    });
  </script>
</body>
</html>
