<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>All Bookings — Admin Console</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="app-container header-inner">
      <a href="/admin/index.html" class="brand-logo">
        <div class="brand-icon" style="background: #1e40af;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <span>TourGuide</span>
        <span class="brand-badge" style="color: #1e40af;">ADMIN</span>
      </a>

      <nav class="nav-links">
        <a href="/admin/index.html" class="nav-link">Dashboard</a>
        <a href="/admin/guides.html" class="nav-link">Guides & Verification</a>
        <a href="/admin/bookings.html" class="nav-link active">Bookings</a>
        <a href="/admin/payments.html" class="nav-link">Payments</a>
        <a href="/admin/reports.html" class="nav-link">Reports</a>
      </nav>

      <div class="header-actions"></div>
    </div>
  </header>

  <main class="main-content">
    <div class="app-container">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6);">
        <h1 style="font-size: 1.5rem; font-weight: 800;">Marketplace Bookings Pipeline</h1>
      </div>

      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Type</th>
              <th>Tourist</th>
              <th>Guide</th>
              <th>Location</th>
              <th>Duration</th>
              <th>Total Paid</th>
              <th>Platform Fee</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="allBookingsTbody"></tbody>
        </table>
      </div>

    </div>
  </main>

  <script type="module">
    import { db, COLLECTIONS } from '/js/firebase.js';
    import { enforceRouteProtection, onAuthReady } from '/js/auth.js';

    enforceRouteProtection({ allowedRoles: ['admin'] });

    async function loadAllBookings() {
      const bookings = await db.getCollection(COLLECTIONS.BOOKINGS);
      const tbody = document.getElementById('allBookingsTbody');

      tbody.innerHTML = bookings.reverse().map(b => `
        <tr>
          <td style="font-family: monospace; font-weight: 700;">${b.id}</td>
          <td><span class="badge badge-gray">${(b.type || 'instant').toUpperCase()}</span></td>
          <td>${b.touristName || 'Tourist'}</td>
          <td>${b.guideName || 'Guide'}</td>
          <td>${b.location || 'Cairo'}</td>
          <td>${b.duration || '2 hours'}</td>
          <td style="font-weight: 700;">$${b.total}</td>
          <td style="color: var(--success); font-weight: 700;">$${b.platformFee || (b.total * 0.15).toFixed(2)}</td>
          <td><span class="badge ${b.status === 'Tour Completed' ? 'badge-gray' : 'badge-online'}">${b.status}</span></td>
          <td>
            <a href="/tourist/booking.html?id=${b.id}" class="btn btn-outline btn-sm">Inspect Ride</a>
          </td>
        </tr>
      `).join('');
    }

    onAuthReady((user) => {
      if (user) loadAllBookings();
    });
  </script>
</body>
</html>
