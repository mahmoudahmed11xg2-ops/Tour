<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="app-root" content="../">
  <title>Guides | TourGuide Admin</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js",
      "firebase/analytics": "https://www.gstatic.com/firebasejs/13.4.0/firebase-analytics.js"
    }
  }
  </script>
</head>
<body class="protected-page">

  <header class="site-header admin-mobile-header">
    <div class="header-inner">
      <div class="header-left">
        <button type="button" id="mobileMenuToggle" class="hamburger-btn" aria-label="Menu" aria-expanded="false" aria-controls="mobileDrawer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <a href="./index.html" class="brand-wordmark" data-i18n="brand.name">TourGuide</a>
      </div>
      <div class="header-actions">
        <button type="button" class="lang-toggle-btn" aria-label="Toggle language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label">English</span>
        </button>
      </div>
    </div>
  </header>

  <div id="mobileDrawerBackdrop" class="mobile-drawer-backdrop"></div>
  <aside id="mobileDrawer" class="mobile-drawer" aria-hidden="true">
    <div class="drawer-header">
      <strong class="brand-wordmark" data-i18n="brand.adminBadge">Admin</strong>
      <button type="button" id="mobileDrawerClose" class="drawer-close-btn" aria-label="Close">&times;</button>
    </div>
    <nav class="drawer-nav">
      <a href="./index.html" class="drawer-link" data-i18n="nav.dashboard">Dashboard</a>
      <a href="./users.html" class="drawer-link" data-i18n="nav.users">Users</a>
      <a href="./guides.html" class="drawer-link active" data-i18n="nav.guides">Guides</a>
      <a href="./bookings.html" class="drawer-link" data-i18n="nav.bookings">Bookings</a>
      <a href="./payments.html" class="drawer-link" data-i18n="nav.payments">Payments</a>
      <a href="./reports.html" class="drawer-link" data-i18n="nav.reports">Reports</a>
      <a href="./settings.html" class="drawer-link" data-i18n="nav.settings">Settings</a>
    </nav>
    <div id="drawerAuthSlot" class="drawer-footer"></div>
  </aside>

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-brand">
        <a href="./index.html" class="brand-wordmark" data-i18n="brand.name">TourGuide</a>
      </div>
      <nav class="admin-sidebar-nav">
        <a href="./index.html" class="nav-link" data-i18n="nav.dashboard">Dashboard</a>
        <a href="./users.html" class="nav-link" data-i18n="nav.users">Users</a>
        <a href="./guides.html" class="nav-link active" data-i18n="nav.guides">Guides</a>
        <a href="./bookings.html" class="nav-link" data-i18n="nav.bookings">Bookings</a>
        <a href="./payments.html" class="nav-link" data-i18n="nav.payments">Payments</a>
        <a href="./reports.html" class="nav-link" data-i18n="nav.reports">Reports</a>
        <a href="./settings.html" class="nav-link" data-i18n="nav.settings">Settings</a>
      </nav>
      <div class="admin-sidebar-footer">
        <button type="button" class="lang-toggle-btn btn-block" aria-label="Toggle language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label">English</span>
        </button>
        <button type="button" id="sidebarLogoutBtn" class="btn btn-outline btn-block btn-sm" data-i18n="nav.logout">Log out</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="page-header">
        <h1 class="page-title" data-i18n="admin.allGuidesTitle">Guides &amp; Verification</h1>
      </div>
      <div id="guidesTableWrap"></div>
    </main>
  </div>

  <script type="module" src="../js/nav.js"></script>
  <script type="module">
    import { enforceRouteProtection, logout, onAuthReady } from '../js/auth.js';
    import { fetchGuides, updateGuideVerification } from '../js/guides.js';
    import { applyTranslations, setupLanguageToggle, showToast, t, formatCurrency, resolveAvatar, getLocalizedStatus, escapeHtml } from '../js/utils.js';

    enforceRouteProtection({ allowedRoles: ['admin'] });
    applyTranslations();
    setupLanguageToggle();
    document.getElementById('sidebarLogoutBtn')?.addEventListener('click', logout);

    let guides = [];

    function renderGuides() {
      document.getElementById('guidesTableWrap').innerHTML = `
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>${escapeHtml(t('admin.guideCol'))}</th>
                <th>${escapeHtml(t('admin.cityCol'))}</th>
                <th>${escapeHtml(t('admin.languagesCol'))}</th>
                <th>${escapeHtml(t('admin.rateCol'))}</th>
                <th>${escapeHtml(t('admin.verificationCol'))}</th>
                <th>${escapeHtml(t('admin.actionCol'))}</th>
              </tr>
            </thead>
            <tbody>
              ${guides.map(g => {
                const avatar = resolveAvatar(g.avatar, g.name);
                const approved = g.verificationStatus === 'approved';
                return `
                  <tr>
                    <td>
                      <div style="display:flex; align-items:center; gap:10px;">
                        <img src="${avatar}" alt="${escapeHtml(g.name)}" style="width:36px; height:36px; border-radius:8px; object-fit:cover;" referrerpolicy="no-referrer">
                        <strong>${escapeHtml(g.name)}</strong>
                      </div>
                    </td>
                    <td>${escapeHtml(g.city || '')}</td>
                    <td>${escapeHtml(Array.isArray(g.languages) ? g.languages.join(', ') : '')}</td>
                    <td class="tabular-nums">${formatCurrency(g.hourlyRate || 25)}/hr</td>
                    <td><span class="status-label ${approved ? 'status-success' : 'status-warning'}">${escapeHtml(getLocalizedStatus(g.verificationStatus || 'pending', 'guide'))}</span></td>
                    <td>
                      ${approved
                        ? `<button type="button" class="btn btn-outline btn-sm" data-suspend="${escapeHtml(g.id)}">${escapeHtml(t('admin.reject'))}</button>`
                        : `<button type="button" class="btn btn-primary btn-sm" data-approve="${escapeHtml(g.id)}">${escapeHtml(t('admin.quickApprove'))}</button>`
                      }
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;

      document.querySelectorAll('[data-approve]').forEach(btn => {
        btn.addEventListener('click', async () => {
          await updateGuideVerification(btn.dataset.approve, 'approved');
          showToast(t('toasts.guideApproved'), 'success');
          guides = await fetchGuides();
          renderGuides();
        });
      });

      document.querySelectorAll('[data-suspend]').forEach(btn => {
        btn.addEventListener('click', async () => {
          await updateGuideVerification(btn.dataset.suspend, 'rejected');
          showToast(t('toasts.guideRejected'), 'info');
          guides = await fetchGuides();
          renderGuides();
        });
      });
    }

    onAuthReady(async (user) => {
      if (!user) return;
      guides = await fetchGuides();
      renderGuides();
    });

    document.addEventListener('tourguide:langchange', renderGuides);
  </script>
</body>
</html>
