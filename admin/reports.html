<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reports & Audit Logs — Admin Console</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="app-container header-inner">
      <a href="/admin/index.html" class="brand-logo">
        <div class="brand-icon" style="background: #1e40af;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <span>TourGuide</span>
        <span class="brand-badge" style="color: #1e40af;">ADMIN</span>
      </a>

      <nav class="nav-links">
        <a href="/admin/index.html" class="nav-link">Dashboard</a>
        <a href="/admin/guides.html" class="nav-link">Guides & Verification</a>
        <a href="/admin/bookings.html" class="nav-link">Bookings</a>
        <a href="/admin/payments.html" class="nav-link">Payments</a>
        <a href="/admin/reports.html" class="nav-link active">Reports</a>
      </nav>

      <div class="header-actions"></div>
    </div>
  </header>

  <main class="main-content">
    <div class="app-container">
      
      <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: var(--space-6);">Reports & Security Audit Logs</h1>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Immutable System Audit Trail</h2>
          <span style="font-size: 0.8rem; color: var(--text-muted);">Real-time log stream</span>
        </div>

        <div id="auditLogsContainer" style="display: grid; gap: var(--space-3);">
          <!-- Dynamically populated -->
        </div>
      </div>

    </div>
  </main>

  <script type="module">
    import { db, COLLECTIONS } from '/js/firebase.js';
    import { enforceRouteProtection, onAuthReady } from '/js/auth.js';

    enforceRouteProtection({ allowedRoles: ['admin'] });

    async function loadLogs() {
      const logs = await db.getCollection(COLLECTIONS.AUDIT_LOGS);
      const container = document.getElementById('auditLogsContainer');

      if (!logs || logs.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem; padding: 12px;">No audit log events recorded yet.</p>';
        return;
      }

      container.innerHTML = logs.reverse().map(l => `
        <div style="background: var(--bg-subtle); padding: 12px 14px; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;">
          <div>
            <span style="font-family: monospace; font-weight: 700; color: var(--primary);">${l.action}</span>
            <span style="display: block; font-size: 0.775rem; color: var(--text-secondary); margin-top: 2px;">
              ${l.notes || l.details || l.bookingId || l.targetId || 'Operation executed'}
            </span>
          </div>
          <span style="font-size: 0.75rem; font-family: monospace; color: var(--text-muted);">
            ${l.timestamp ? new Date(l.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Recent'}
          </span>
        </div>
      `).join('');
    }

    onAuthReady((user) => {
      if (user) loadLogs();
    });
  </script>
</body>
</html>
