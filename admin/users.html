<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="app-root" content="../">
  <title>Users | TourGuide Admin</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="protected-page">

  <header class="site-header admin-mobile-header">
    <div class="header-inner">
      <div class="header-left">
        <button type="button" id="mobileMenuToggle" class="hamburger-btn" aria-label="Menu" aria-expanded="false" aria-controls="mobileDrawer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <a href="./index.html" class="brand-wordmark" data-i18n="brand.name">TourGuide</a>
      </div>
      <div class="header-actions">
        <button type="button" class="lang-toggle-btn" aria-label="Toggle language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label">English</span>
        </button>
      </div>
    </div>
  </header>

  <div id="mobileDrawerBackdrop" class="mobile-drawer-backdrop"></div>
  <aside id="mobileDrawer" class="mobile-drawer" aria-hidden="true">
    <div class="drawer-header">
      <strong class="brand-wordmark" data-i18n="brand.adminBadge">Admin</strong>
      <button type="button" id="mobileDrawerClose" class="drawer-close-btn" aria-label="Close">&times;</button>
    </div>
    <nav class="drawer-nav">
      <a href="./index.html" class="drawer-link" data-i18n="nav.dashboard">Dashboard</a>
      <a href="./users.html" class="drawer-link active" data-i18n="nav.users">Users</a>
      <a href="./guides.html" class="drawer-link" data-i18n="nav.guides">Guides</a>
      <a href="./bookings.html" class="drawer-link" data-i18n="nav.bookings">Bookings</a>
      <a href="./payments.html" class="drawer-link" data-i18n="nav.payments">Payments</a>
      <a href="./reports.html" class="drawer-link" data-i18n="nav.reports">Reports</a>
      <a href="./settings.html" class="drawer-link" data-i18n="nav.settings">Settings</a>
    </nav>
    <div id="drawerAuthSlot" class="drawer-footer"></div>
  </aside>

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-brand">
        <a href="./index.html" class="brand-wordmark" data-i18n="brand.name">TourGuide</a>
      </div>
      <nav class="admin-sidebar-nav">
        <a href="./index.html" class="nav-link" data-i18n="nav.dashboard">Dashboard</a>
        <a href="./users.html" class="nav-link active" data-i18n="nav.users">Users</a>
        <a href="./guides.html" class="nav-link" data-i18n="nav.guides">Guides</a>
        <a href="./bookings.html" class="nav-link" data-i18n="nav.bookings">Bookings</a>
        <a href="./payments.html" class="nav-link" data-i18n="nav.payments">Payments</a>
        <a href="./reports.html" class="nav-link" data-i18n="nav.reports">Reports</a>
        <a href="./settings.html" class="nav-link" data-i18n="nav.settings">Settings</a>
      </nav>
      <div class="admin-sidebar-footer">
        <button type="button" class="lang-toggle-btn btn-block" aria-label="Toggle language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label">English</span>
        </button>
        <button type="button" id="sidebarLogoutBtn" class="btn btn-outline btn-block btn-sm" data-i18n="nav.logout">Log out</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="page-header">
        <h1 class="page-title" data-i18n="admin.usersTitle">Users</h1>
      </div>
      <div id="usersTableWrap"></div>
    </main>
  </div>

  <script type="module" src="../js/nav.js"></script>
  <script type="module">
    import { doc, updateDoc, addDoc, collection } from 'firebase/firestore';
    import { enforceRouteProtection, getCurrentUser, logout, onAuthReady } from '../js/auth.js';
    import { db, COLLECTIONS } from '../js/firebase.js';
    import { applyTranslations, setupLanguageToggle, showToast, t, getLocalizedRole, escapeHtml } from '../js/utils.js';

    enforceRouteProtection({ allowedRoles: ['admin'] });
    applyTranslations();
    setupLanguageToggle();
    document.getElementById('sidebarLogoutBtn')?.addEventListener('click', logout);

    let users = [];

    function renderStatusBadge(st) {
      if (st === 'suspended') {
        return `<span class="status-label status-danger">${escapeHtml(t('admin.suspendedUserStatus'))}</span>`;
      }
      if (st === 'deletion_requested') {
        return `<span class="status-label status-danger">${escapeHtml(t('admin.deletionRequestedStatus'))}</span>`;
      }
      if (st === 'pending') {
        return `<span class="status-label status-warning">${escapeHtml(t('guide.pendingVerificationBadge'))}</span>`;
      }
      return `<span class="status-label status-success">${escapeHtml(t('admin.activeUserStatus'))}</span>`;
    }

    async function toggleUserStatus(targetUid, nextStatus) {
      const admin = getCurrentUser();
      const nowIso = new Date().toISOString();
      await updateDoc(doc(db, COLLECTIONS.USERS, targetUid), {
        status: nextStatus,
        updatedAt: nowIso
      });
      const targetUser = users.find(u => (u.uid || u.id) === targetUid);
      if (targetUser?.role === 'guide' && nextStatus === 'suspended') {
        try {
          await updateDoc(doc(db, COLLECTIONS.GUIDES, targetUid), {
            isOnline: false,
            updatedAt: nowIso
          });
        } catch (e) {
          console.warn('Guide suspend sync notice:', e.message);
        }
      }
      await addDoc(collection(db, COLLECTIONS.AUDIT_LOGS), {
        action: `ADMIN_USER_${nextStatus.toUpperCase()}`,
        actorId: admin?.uid || null,
        targetId: targetUid,
        timestamp: nowIso
      });
      showToast(t('admin.userStatusUpdatedToast'), 'success');
      users = await db.getCollection(COLLECTIONS.USERS);
      renderUsers();
    }

    function renderUsers() {
      document.getElementById('usersTableWrap').innerHTML = `
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>${escapeHtml(t('admin.userIdCol'))}</th>
                <th>${escapeHtml(t('admin.nameCol'))}</th>
                <th>${escapeHtml(t('admin.emailCol'))}</th>
                <th>${escapeHtml(t('admin.roleCol'))}</th>
                <th>${escapeHtml(t('admin.countryCol'))}</th>
                <th>${escapeHtml(t('admin.statusCol'))}</th>
                <th>${escapeHtml(t('admin.actionCol'))}</th>
              </tr>
            </thead>
            <tbody>
              ${users.map(u => {
                const uid = u.uid || u.id || '';
                const isSuspended = u.status === 'suspended' || u.status === 'deletion_requested';
                const canToggle = u.role !== 'admin';
                return `
                  <tr>
                    <td class="tabular-nums">${escapeHtml(uid.slice(0, 10))}</td>
                    <td><strong>${escapeHtml(`${u.firstName || ''} ${u.lastName || ''}`.trim() || u.email)}</strong></td>
                    <td>${escapeHtml(u.email || '')}</td>
                    <td><span class="status-label status-info">${escapeHtml(getLocalizedRole(u.role))}</span></td>
                    <td>${escapeHtml(u.country || '')}</td>
                    <td>${renderStatusBadge(u.status || 'active')}</td>
                    <td>
                      ${canToggle ? (
                        isSuspended
                          ? `<button type="button" class="btn btn-primary btn-sm" data-reactivate="${escapeHtml(uid)}">${escapeHtml(t('admin.reactivateUserBtn'))}</button>`
                          : `<button type="button" class="btn btn-outline btn-sm" data-suspend="${escapeHtml(uid)}">${escapeHtml(t('admin.suspendUserBtn'))}</button>`
                      ) : '—'}
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;

      document.querySelectorAll('[data-suspend]').forEach(btn => {
        btn.addEventListener('click', () => toggleUserStatus(btn.dataset.suspend, 'suspended'));
      });
      document.querySelectorAll('[data-reactivate]').forEach(btn => {
        btn.addEventListener('click', () => toggleUserStatus(btn.dataset.reactivate, 'active'));
      });
    }

    onAuthReady(async (user) => {
      if (!user) return;
      users = await db.getCollection(COLLECTIONS.USERS);
      renderUsers();
    });

    document.addEventListener('tourguide:langchange', renderUsers);
  </script>
</body>
</html>
