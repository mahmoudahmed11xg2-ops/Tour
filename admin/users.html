<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>User Accounts — Admin Console</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="app-container header-inner">
      <a href="/admin/index.html" class="brand-logo">
        <div class="brand-icon" style="background: #1e40af;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <span>TourGuide</span>
        <span class="brand-badge" style="color: #1e40af;">ADMIN</span>
      </a>

      <nav class="nav-links">
        <a href="/admin/index.html" class="nav-link">Dashboard</a>
        <a href="/admin/guides.html" class="nav-link">Guides & Verification</a>
        <a href="/admin/bookings.html" class="nav-link">Bookings</a>
        <a href="/admin/payments.html" class="nav-link">Payments</a>
        <a href="/admin/reports.html" class="nav-link">Reports</a>
      </nav>

      <div class="header-actions"></div>
    </div>
  </header>

  <main class="main-content">
    <div class="app-container">
      
      <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: var(--space-6);">Marketplace User Accounts</h1>

      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>User ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Country</th>
            </tr>
          </thead>
          <tbody id="usersTbody"></tbody>
        </table>
      </div>

    </div>
  </main>

  <script type="module">
    import { db, COLLECTIONS } from '/js/firebase.js';
    import { enforceRouteProtection, onAuthReady } from '/js/auth.js';

    enforceRouteProtection({ allowedRoles: ['admin'] });

    async function loadUsers() {
      const users = await db.getCollection(COLLECTIONS.USERS);
      const tbody = document.getElementById('usersTbody');

      tbody.innerHTML = users.map(u => `
        <tr>
          <td style="font-family: monospace; font-weight: 700;">${u.uid || u.id}</td>
          <td style="font-weight: 600;">${u.firstName || ''} ${u.lastName || ''}</td>
          <td>${u.email}</td>
          <td><span class="badge ${u.role === 'admin' ? 'badge-verified' : u.role === 'guide' ? 'badge-online' : 'badge-gray'}">${(u.role || 'tourist').toUpperCase()}</span></td>
          <td>${u.country || 'International'}</td>
        </tr>
      `).join('');
    }

    onAuthReady((user) => {
      if (user) loadUsers();
    });
  </script>
</body>
</html>
