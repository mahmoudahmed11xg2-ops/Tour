<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="app-root" content="../">
  <title>Requests | TourGuide</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/guide.css">
</head>
<body class="protected-page">

  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <button type="button" id="mobileMenuToggle" class="hamburger-btn" aria-label="Menu" aria-expanded="false" aria-controls="mobileDrawer">

            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <a href="./index.html" class="brand-wordmark">
          <span class="brand-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <circle cx="12" cy="10" r="3"></circle>
              <path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 6.9 8 11.7z"></path>
            </svg>
          </span>
          <span data-i18n="brand.name">TourGuide</span>
        </a>
      </div>

      <nav class="header-nav" aria-label="Guide Navigation">
        <a href="./index.html" class="nav-link" data-i18n="nav.home">Home</a>
        <a href="./requests.html" class="nav-link active" data-i18n="nav.requests">Requests</a>
        <a href="./calendar.html" class="nav-link" data-i18n="nav.calendar">Calendar</a>
        <a href="./earnings.html" class="nav-link" data-i18n="nav.earnings">Earnings</a>
        <a href="./messages.html" class="nav-link" data-i18n="nav.messages">Messages</a>
        <a href="./profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
      </nav>

      <div class="header-actions">
        <button type="button" class="lang-toggle-btn" aria-label="Toggle language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label">English</span>
        </button>
        <span id="authHeaderSlot" class="auth-header-slot"></span>
      </div>
    </div>
  </header>

  <div id="mobileDrawerBackdrop" class="mobile-drawer-backdrop"></div>
  <aside id="mobileDrawer" class="mobile-drawer" aria-hidden="true">
    <div class="drawer-header">
      <strong class="brand-wordmark" data-i18n="guide.consoleTitle">Guide Console</strong>
      <button type="button" id="mobileDrawerClose" class="drawer-close-btn" aria-label="Close">&times;</button>
    </div>
    <nav class="drawer-nav" aria-label="Guide Mobile Drawer">
      <a href="./index.html" class="drawer-link" data-i18n="nav.home">Home</a>
      <a href="./requests.html" class="drawer-link active" data-i18n="nav.requests">Requests</a>
      <a href="./calendar.html" class="drawer-link" data-i18n="nav.calendar">Calendar</a>
      <a href="./earnings.html" class="drawer-link" data-i18n="nav.earnings">Earnings</a>
      <a href="./messages.html" class="drawer-link" data-i18n="nav.messages">Messages</a>
      <a href="./profile.html" class="drawer-link" data-i18n="nav.profile">Profile</a>
    </nav>
    <div id="drawerAuthSlot" class="drawer-footer"></div>
  </aside>

  <main class="container-narrow page-main">
    <div class="page-header">
      <h1 class="page-title" data-i18n="guide.requestsTitle">Requests</h1>
    </div>
    <div id="requestsFeed" style="display:flex; flex-direction:column; gap:12px;"></div>
  </main>

  <nav class="bottom-nav" aria-label="Guide Mobile Navigation">
    <a href="./index.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span data-i18n="nav.home">Home</span>
    </a>
    <a href="./requests.html" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg>
      <span data-i18n="nav.requests">Requests</span>
    </a>
    <a href="./calendar.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line></svg>
      <span data-i18n="nav.calendar">Calendar</span>
    </a>
    <a href="./earnings.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <span data-i18n="nav.earnings">Earnings</span>
    </a>
    <a href="./profile.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span data-i18n="nav.profile">Profile</span>
    </a>
  </nav>

  <script type="module" src="../js/nav.js"></script>
  <script type="module">
    import { enforceRouteProtection, onAuthReady } from '../js/auth.js';
    import {
      subscribeToGuideBookings,
      acceptBooking,
      declineBooking,
      progressBookingStatus,
      ALLOWED_GUIDE_TRANSITIONS
    } from '../js/booking.js';
    import {
      applyTranslations,
      setupLanguageToggle,
      showToast,
      t,
      formatCurrency,
      formatBookingDateTime,
      formatDuration,
      getLocalizedStatus,
      escapeHtml
    } from '../js/utils.js';

    enforceRouteProtection({ allowedRoles: ['guide'] });
    applyTranslations();
    setupLanguageToggle();

    let allBookings = [];
    let currentUid = null;

    function nextBtnLabel(status) {
      if (status === 'confirmed' || status === 'accepted') return t('guide.startArriving');
      if (status === 'guide_arriving') return t('guide.markMet');
      if (status === 'meeting_started') return t('guide.startTour');
      if (status === 'in_progress') return t('guide.completeTour');
      return '';
    }

    function renderFeed() {
      const feed = document.getElementById('requestsFeed');
      if (!allBookings.length) {
        feed.innerHTML = `
          <div class="empty-state">
            <h3>${escapeHtml(t('guide.noPendingRequestsTitle'))}</h3>
            <p>${escapeHtml(t('guide.noPendingRequestsDesc'))}</p>
          </div>
        `;
        return;
      }

      feed.innerHTML = allBookings.map(b => {
        const isPending = b.status === 'pending';
        const nextSt = ALLOWED_GUIDE_TRANSITIONS[b.status];
        return `
          <article class="request-item">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
              <div>
                <strong>${escapeHtml(b.touristName || t('guide.touristLabel'))}</strong>
                <div class="form-hint tabular-nums">#${escapeHtml(b.id)}</div>
              </div>
              <span class="status-label ${b.status === 'completed' || b.status === 'confirmed' ? 'status-success' : b.status === 'pending' ? 'status-warning' : 'status-neutral'}">${escapeHtml(getLocalizedStatus(b.status))}</span>
            </div>
            <div class="meta-inline">
              <span>${escapeHtml(b.location || '')}</span>
              <span class="meta-sep">&middot;</span>
              <span class="tabular-nums">${escapeHtml(formatDuration(b.duration))}</span>
              <span class="meta-sep">&middot;</span>
              <span>${escapeHtml(b.language || '')}</span>
              <span class="meta-sep">&middot;</span>
              <strong class="tabular-nums">${formatCurrency(b.price || 0, b.currency || 'USD')}</strong>
            </div>
            <div class="form-hint tabular-nums">${escapeHtml(formatBookingDateTime(b.date, b.startTime, b.endTime))}</div>
            <div class="request-actions">
              ${isPending ? `
                <button type="button" class="btn btn-primary btn-sm" data-accept="${escapeHtml(b.id)}">${escapeHtml(t('guide.acceptTour'))}</button>
                <button type="button" class="btn btn-outline btn-sm" data-decline="${escapeHtml(b.id)}">${escapeHtml(t('guide.decline'))}</button>
              ` : ''}
              ${nextSt ? `<button type="button" class="btn btn-primary btn-sm" data-advance="${escapeHtml(b.id)}">${escapeHtml(nextBtnLabel(b.status))}</button>` : ''}
              <a href="./messages.html?bookingId=${encodeURIComponent(b.id)}" class="btn btn-outline btn-sm">${escapeHtml(t('guide.contactTourist'))}</a>
              <a href="./booking.html?id=${encodeURIComponent(b.id)}" class="btn btn-outline btn-sm">${escapeHtml(t('guide.openTracking'))}</a>
            </div>
          </article>
        `;
      }).join('');

      feed.querySelectorAll('[data-accept]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
            await acceptBooking(btn.dataset.accept, currentUid);
            showToast(t('toasts.tourAccepted'), 'success');
          } catch (err) {
            showToast(err.message, 'error');
            btn.disabled = false;
          }
        });
      });

      feed.querySelectorAll('[data-decline]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
            const res = await declineBooking(btn.dataset.decline, currentUid);
            showToast(res.outcome === 'reassigned' ? t('toasts.tourReassigned') : t('toasts.tourDeclined'), 'info');
          } catch (err) {
            showToast(err.message, 'error');
            btn.disabled = false;
          }
        });
      });

      feed.querySelectorAll('[data-advance]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
            const ns = await progressBookingStatus(btn.dataset.advance, currentUid);
            showToast(t('toasts.statusUpdated', { status: getLocalizedStatus(ns) }), 'success');
          } catch (err) {
            showToast(err.message, 'error');
            btn.disabled = false;
          }
        });
      });
    }

    onAuthReady((user) => {
      if (!user) return;
      currentUid = user.uid;
      subscribeToGuideBookings(user.uid, (list) => {
        allBookings = list;
        renderFeed();
      });
    });

    document.addEventListener('tourguide:langchange', renderFeed);
  </script>
</body>
</html>
