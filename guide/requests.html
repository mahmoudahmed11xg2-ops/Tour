<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tour Requests — TourGuide</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/guide.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="app-container header-inner">
      <a href="/guide/index.html" class="brand-logo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>
        <span>TourGuide</span>
        <span class="brand-badge">CAPTAIN</span>
      </a>

      <nav class="nav-links">
        <a href="/guide/index.html" class="nav-link" data-i18n="nav.overview">Overview</a>
        <a href="/guide/requests.html" class="nav-link active" data-i18n="nav.requests">Requests</a>
        <a href="/guide/calendar.html" class="nav-link" data-i18n="nav.calendar">Calendar</a>
        <a href="/guide/earnings.html" class="nav-link" data-i18n="nav.earnings">Earnings</a>
        <a href="/guide/profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
      </nav>

      <div class="header-actions"></div>
    </div>
  </header>

  <main class="main-content">
    <div class="app-container" style="max-width: 900px;">
      
      <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: var(--space-6);" data-i18n="guide.requestsTitle">Booking Requests Queue</h1>

      <div class="card" style="margin-bottom: var(--space-4);">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-3);">
          <div>
            <span class="badge badge-online" style="margin-bottom: 6px;" data-i18n="guide.liveRequest">Live Request</span>
            <h3 style="font-size: 1.05rem; font-weight: 700;">Giza Plateau (Pyramids of Giza)</h3>
            <span style="font-size: 0.8rem; color: var(--text-muted);">Tourist: Elena Rostova · 2 Guests · German/English</span>
          </div>
          <span style="font-size: 1.15rem; font-weight: 800; color: var(--success);">$50.00</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <a href="/tourist/booking.html?id=BK-9021" class="btn btn-primary btn-sm" data-i18n="guide.openTracking">Open Tracking</a>
        </div>
      </div>

    </div>
  </main>

  <script type="module">
    import { onAuthReady, enforceRouteProtection } from '/js/auth.js';
    import { getBookingsForGuide } from '/js/booking.js';

    enforceRouteProtection({ allowedRoles: ['guide', 'admin'] });

    onAuthReady(async (user) => {
      if (!user) return;
      try {
        const bookings = await getBookingsForGuide(user.uid);
        console.log('Loaded requests for guide:', bookings.length);
      } catch (err) {
        console.warn('Load requests:', err);
      }
    });
  </script>
</body>
</html>
