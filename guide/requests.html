<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tour Requests — TourGuide</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/guide.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="app-container header-inner">
      <a href="/guide/index.html" class="brand-logo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>
        <span>TourGuide</span>
        <span class="brand-badge" data-i18n="brand.captainBadge">CAPTAIN</span>
      </a>

      <nav class="nav-links">
        <a href="/guide/index.html" class="nav-link" data-i18n="nav.overview">Overview</a>
        <a href="/guide/requests.html" class="nav-link active" data-i18n="nav.requests">Requests</a>
        <a href="/guide/calendar.html" class="nav-link" data-i18n="nav.calendar">Calendar</a>
        <a href="/guide/earnings.html" class="nav-link" data-i18n="nav.earnings">Earnings</a>
        <a href="/guide/profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
      </nav>

      <div class="header-actions"></div>
    </div>
  </header>

  <main class="main-content">
    <div class="app-container" style="max-width: 900px;">

      <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: var(--space-6);" data-i18n="guide.requestsTitle">Booking Requests Queue</h1>

      <div id="requestsQueueList" style="display: grid; gap: var(--space-4);"></div>

    </div>
  </main>

  <script type="module">
    import { onAuthReady, enforceRouteProtection } from '/js/auth.js';
    import {
      BOOKING_STATUS,
      ALLOWED_GUIDE_TRANSITIONS,
      subscribeToGuideBookings,
      acceptBooking,
      declineBooking,
      progressBookingStatus
    } from '/js/booking.js';
    import {
      showToast,
      t,
      getLocalizedStatus,
      formatCurrency,
      formatDuration,
      formatBookingDateTime
    } from '/js/utils.js';

    enforceRouteProtection({ allowedRoles: ['guide', 'admin'] });

    const container = document.getElementById('requestsQueueList');
    let currentGuideId = null;
    let latestBookings = [];
    let unsubscribe = null;

    function renderQueue(bookings) {
      latestBookings = bookings || [];

      if (latestBookings.length === 0) {
        container.innerHTML = `
          <div class="empty-state card">
            <h2 class="empty-state-title">${t('guide.noPendingRequestsTitle')}</h2>
            <p class="empty-state-desc">${t('guide.noPendingRequestsDesc')}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = latestBookings.map(b => {
        const net = Math.max(0, Number(b.price || 0) - Number(b.platformFee || 0));
        const isPending = b.status === BOOKING_STATUS.PENDING;
        const nextStatus = ALLOWED_GUIDE_TRANSITIONS[b.status];
        const nextLabelMap = {
          confirmed: t('guide.acceptTour'),
          guide_arriving: t('guide.startArriving'),
          meeting_started: t('guide.markMet'),
          in_progress: t('guide.startTour'),
          completed: t('guide.completeTour')
        };

        return `
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-3); gap: var(--space-3);">
              <div>
                <div style="display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap;">
                  <span class="badge ${isPending ? 'badge-warning' : b.status === 'completed' ? 'badge-gray' : 'badge-online'}">
                    ${getLocalizedStatus(b.status)}
                  </span>
                  <span class="badge badge-gray">
                    ${b.bookingType === 'instant' ? t('booking.instantType') : t('booking.scheduledType')}
                  </span>
                </div>
                <h3 style="font-size: 1.05rem; font-weight: 700;">${b.location}</h3>
                <span style="font-size: 0.825rem; color: var(--text-secondary); display: block; margin-top: 2px;">
                  ${b.touristName} · ${b.guests} ${t('guide.guests')} · ${b.language} · ${formatDuration(b.duration)}
                </span>
                <span style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-top: 2px;">
                  ${formatBookingDateTime(b.date, b.startTime, b.endTime)}
                </span>
              </div>
              <div style="text-align: end;">
                <span style="font-size: 0.72rem; color: var(--text-muted); display: block;">${t('guide.estimatedEarnings')}</span>
                <span style="font-size: 1.15rem; font-weight: 800; color: var(--success);">${formatCurrency(net.toFixed(2), b.currency || 'USD')}</span>
              </div>
            </div>

            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              ${isPending ? `
                <button class="btn btn-accept btn-sm accept-btn" data-id="${b.id}">${t('guide.acceptTour')}</button>
                <button class="btn btn-decline btn-sm decline-btn" data-id="${b.id}">${t('guide.decline')}</button>
              ` : nextStatus ? `
                <button class="btn btn-primary btn-sm progress-btn" data-id="${b.id}" data-next="${nextStatus}">${nextLabelMap[nextStatus] || nextStatus}</button>
              ` : ''}
              <a href="/tourist/booking.html?id=${b.id}" class="btn btn-outline btn-sm">${t('guide.openTracking')}</a>
            </div>
          </div>
        `;
      }).join('');

      container.querySelectorAll('.accept-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          try {
            await acceptBooking(id, currentGuideId);
            showToast(t('toasts.tourAccepted'), 'success');
          } catch (err) {
            showToast(err.message || 'Accept failed', 'error');
          }
        });
      });

      container.querySelectorAll('.decline-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          try {
            const res = await declineBooking(id, currentGuideId);
            showToast(res.outcome === 'reassigned' ? t('toasts.tourReassigned') : t('toasts.tourDeclined'), 'info');
          } catch (err) {
            showToast(err.message || 'Decline failed', 'error');
          }
        });
      });

      container.querySelectorAll('.progress-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          const next = e.currentTarget.getAttribute('data-next');
          try {
            await progressBookingStatus(id, currentGuideId, next);
            showToast(t('toasts.statusUpdated', { status: getLocalizedStatus(next) }), 'success');
          } catch (err) {
            showToast(err.message || 'Update failed', 'error');
          }
        });
      });
    }

    onAuthReady((user) => {
      if (!user) return;
      currentGuideId = user.uid;
      container.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
      if (unsubscribe) unsubscribe();
      unsubscribe = subscribeToGuideBookings(currentGuideId, renderQueue);
    });

    document.addEventListener('tourguide:langchange', () => {
      renderQueue(latestBookings);
    });
  </script>
</body>
</html>
