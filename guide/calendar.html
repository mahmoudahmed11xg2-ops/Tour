<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="app-root" content="../">
  <title>Calendar | TourGuide</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/guide.css">
</head>
<body class="protected-page">

  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <button type="button" id="mobileMenuToggle" class="hamburger-btn" aria-label="Menu" aria-expanded="false" aria-controls="mobileDrawer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <a href="./index.html" class="brand-wordmark">
          <span class="brand-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <circle cx="12" cy="10" r="3"></circle>
              <path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 6.9 8 11.7z"></path>
            </svg>
          </span>
          <span data-i18n="brand.name">TourGuide</span>
        </a>
      </div>

      <nav class="header-nav" aria-label="Guide Navigation">
        <a href="./index.html" class="nav-link" data-i18n="nav.home">Home</a>
        <a href="./requests.html" class="nav-link" data-i18n="nav.requests">Requests</a>
        <a href="./calendar.html" class="nav-link active" data-i18n="nav.calendar">Calendar</a>
        <a href="./earnings.html" class="nav-link" data-i18n="nav.earnings">Earnings</a>
        <a href="./messages.html" class="nav-link" data-i18n="nav.messages">Messages</a>
        <a href="./profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
      </nav>

      <div class="header-actions">
        <button type="button" class="lang-toggle-btn" aria-label="Toggle language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label">English</span>
        </button>
        <span id="authHeaderSlot" class="auth-header-slot"></span>
      </div>
    </div>
  </header>

  <div id="mobileDrawerBackdrop" class="mobile-drawer-backdrop"></div>
  <aside id="mobileDrawer" class="mobile-drawer" aria-hidden="true">
    <div class="drawer-header">
      <strong class="brand-wordmark" data-i18n="guide.consoleTitle">Guide Console</strong>
      <button type="button" id="mobileDrawerClose" class="drawer-close-btn" aria-label="Close">&times;</button>
    </div>
    <nav class="drawer-nav" aria-label="Guide Mobile Drawer">
      <a href="./index.html" class="drawer-link" data-i18n="nav.home">Home</a>
      <a href="./requests.html" class="drawer-link" data-i18n="nav.requests">Requests</a>
      <a href="./calendar.html" class="drawer-link active" data-i18n="nav.calendar">Calendar</a>
      <a href="./earnings.html" class="drawer-link" data-i18n="nav.earnings">Earnings</a>
      <a href="./messages.html" class="drawer-link" data-i18n="nav.messages">Messages</a>
      <a href="./profile.html" class="drawer-link" data-i18n="nav.profile">Profile</a>
    </nav>
    <div id="drawerAuthSlot" class="drawer-footer"></div>
  </aside>

  <main class="container-narrow page-main">
    <div class="explore-toolbar">
      <h1 class="page-title" data-i18n="guide.calendarTitle">Calendar &amp; Availability</h1>
      <button type="button" id="resetWeekdaysBtn" class="btn btn-outline btn-sm" data-i18n="guide.quickOpenAll">Reset All Weekdays</button>
    </div>

    <section class="card" style="margin-bottom:18px;">
      <div class="online-bar" style="margin-bottom:14px; padding:10px 12px;">
        <span class="form-label" data-i18n="guide.availableForInstant">Accept instant requests</span>
        <label class="toggle-switch">
          <input type="checkbox" id="instantAvailToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <h2 class="card-title" style="margin-bottom:12px;" data-i18n="guide.weeklySlotsTitle">Weekly Working Hours</h2>
      <div id="weekdayGrid" class="weekday-grid"></div>

      <div class="form-group" style="margin-top:16px;">
        <label for="blockedDatesInput" class="form-label" data-i18n="guide.blockedDatesLabel">Blocked Dates (YYYY-MM-DD, comma-separated)</label>
        <input type="text" id="blockedDatesInput" class="form-control" placeholder="2026-05-01, 2026-05-02">
      </div>

      <button type="button" id="saveScheduleBtn" class="btn btn-primary btn-block" data-i18n="guide.saveScheduleBtn">Save Schedule</button>
    </section>

    <section class="card">
      <h2 class="card-title" style="margin-bottom:10px;" data-i18n="guide.bookedSlotsTitle">Booked Slots</h2>
      <div id="bookedSlotsList"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Guide Mobile Navigation">
    <a href="./index.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span data-i18n="nav.home">Home</span>
    </a>
    <a href="./requests.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg>
      <span data-i18n="nav.requests">Requests</span>
    </a>
    <a href="./calendar.html" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line></svg>
      <span data-i18n="nav.calendar">Calendar</span>
    </a>
    <a href="./earnings.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <span data-i18n="nav.earnings">Earnings</span>
    </a>
    <a href="./profile.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span data-i18n="nav.profile">Profile</span>
    </a>
  </nav>

  <script type="module" src="../js/nav.js"></script>
  <script type="module">
    import { enforceRouteProtection, onAuthReady } from '../js/auth.js';
    import { getGuideById, updateGuideAvailabilitySchedule } from '../js/guides.js';
    import { getGuideBusySlots, WEEKDAY_KEYS, DEFAULT_WEEKLY_AVAILABILITY } from '../js/availability.js';
    import { applyTranslations, setupLanguageToggle, showToast, t, escapeHtml, getLocalizedWeekday, getLocalizedStatus } from '../js/utils.js';

    enforceRouteProtection({ allowedRoles: ['guide'] });
    applyTranslations();
    setupLanguageToggle();

    let currentUid = null;
    let weeklyState = JSON.parse(JSON.stringify(DEFAULT_WEEKLY_AVAILABILITY));
    let busySlots = [];

    function renderWeekdays() {
      const grid = document.getElementById('weekdayGrid');
      grid.innerHTML = WEEKDAY_KEYS.map(day => {
        const cfg = weeklyState[day] || { enabled: false, start: '07:00', end: '23:00' };
        return `
          <div class="weekday-card" data-day="${day}">
            <div class="weekday-top">
              <strong>${escapeHtml(getLocalizedWeekday(day))}</strong>
              <label class="toggle-switch">
                <input type="checkbox" class="day-enabled" data-day="${day}" ${cfg.enabled ? 'checked' : ''}>
                <span class="toggle-slider"></span>
              </label>
            </div>
            <div class="weekday-times">
              <input type="time" class="form-control day-start" data-day="${day}" value="${escapeHtml(cfg.start || '07:00')}">
              <input type="time" class="form-control day-end" data-day="${day}" value="${escapeHtml(cfg.end || '23:00')}">
            </div>
          </div>
        `;
      }).join('');

      grid.querySelectorAll('.day-enabled').forEach(cb => {
        cb.addEventListener('change', () => {
          weeklyState[cb.dataset.day].enabled = cb.checked;
        });
      });
      grid.querySelectorAll('.day-start').forEach(inp => {
        inp.addEventListener('change', () => {
          weeklyState[inp.dataset.day].start = inp.value;
        });
      });
      grid.querySelectorAll('.day-end').forEach(inp => {
        inp.addEventListener('change', () => {
          weeklyState[inp.dataset.day].end = inp.value;
        });
      });
    }

    function renderBookedSlots() {
      const box = document.getElementById('bookedSlotsList');
      if (!busySlots.length) {
        box.innerHTML = `<p class="form-hint">${escapeHtml(t('guide.noBookedSlots'))}</p>`;
        return;
      }
      box.innerHTML = busySlots.map(s => `
        <div class="availability-row" style="margin-bottom:8px;">
          <span class="tabular-nums">${escapeHtml(s.date)} &middot; ${escapeHtml(s.startTime)} – ${escapeHtml(s.endTime)}</span>
          <span class="status-label status-info">${escapeHtml(getLocalizedStatus(s.status))}</span>
        </div>
      `).join('');
    }

    document.getElementById('resetWeekdaysBtn').addEventListener('click', () => {
      weeklyState = JSON.parse(JSON.stringify(DEFAULT_WEEKLY_AVAILABILITY));
      renderWeekdays();
    });

    document.getElementById('saveScheduleBtn').addEventListener('click', async () => {
      if (!currentUid) return;
      const blocked = document.getElementById('blockedDatesInput').value
        .split(',')
        .map(s => s.trim())
        .filter(Boolean);
      const instantAvailable = document.getElementById('instantAvailToggle').checked;

      try {
        await updateGuideAvailabilitySchedule(currentUid, {
          weeklyAvailability: weeklyState,
          blockedDates: blocked,
          instantAvailable
        });
        showToast(t('toasts.slotsOpened'), 'success');
      } catch (err) {
        showToast(err.message || t('toasts.genericError'), 'error');
      }
    });

    onAuthReady(async (user) => {
      if (!user) return;
      currentUid = user.uid;
      const guide = await getGuideById(user.uid);
      if (guide) {
        weeklyState = guide.weeklyAvailability
          ? JSON.parse(JSON.stringify(guide.weeklyAvailability))
          : JSON.parse(JSON.stringify(DEFAULT_WEEKLY_AVAILABILITY));
        document.getElementById('instantAvailToggle').checked = guide.instantAvailable !== false;
        document.getElementById('blockedDatesInput').value = Array.isArray(guide.blockedDates) ? guide.blockedDates.join(', ') : '';
      }
      renderWeekdays();
      busySlots = await getGuideBusySlots(user.uid);
      renderBookedSlots();
    });

    document.addEventListener('tourguide:langchange', () => {
      renderWeekdays();
      renderBookedSlots();
    });
  </script>
</body>
</html>
