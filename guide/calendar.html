<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Availability Calendar — TourGuide</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/guide.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="app-container header-inner">
      <a href="/guide/index.html" class="brand-logo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>
        <span>TourGuide</span>
        <span class="brand-badge" data-i18n="brand.captainBadge">CAPTAIN</span>
      </a>

      <nav class="nav-links">
        <a href="/guide/index.html" class="nav-link" data-i18n="nav.overview">Overview</a>
        <a href="/guide/requests.html" class="nav-link" data-i18n="nav.requests">Requests</a>
        <a href="/guide/calendar.html" class="nav-link active" data-i18n="nav.calendar">Calendar</a>
        <a href="/guide/earnings.html" class="nav-link" data-i18n="nav.earnings">Earnings</a>
        <a href="/guide/profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
      </nav>

      <div class="header-actions"></div>
    </div>
  </header>

  <main class="main-content">
    <div class="app-container" style="max-width: 900px;">

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-3);">
        <h1 style="font-size: 1.5rem; font-weight: 800;" data-i18n="guide.calendarTitle">Availability & Schedule</h1>
        <div style="display: flex; gap: var(--space-2);">
          <button id="openAllBtn" class="btn btn-outline btn-sm" data-i18n="guide.quickOpenAll">Open All Weekdays</button>
          <button id="saveScheduleBtn" class="btn btn-primary btn-sm" data-i18n="guide.saveScheduleBtn">Save Schedule</button>
        </div>
      </div>

      <!-- Weekly Schedule Editor (Persisted to Firestore) -->
      <div class="card" style="margin-bottom: var(--space-6);">
        <div class="card-header">
          <h2 class="card-title" data-i18n="guide.weeklySlotsTitle">Weekly Working Hours & Availability</h2>
          <label class="checkbox-label">
            <input type="checkbox" id="instantAvailableToggle" checked>
            <span style="font-size: 0.825rem; font-weight: 600;" data-i18n="guide.availableForInstant">Available for Instant</span>
          </label>
        </div>

        <div id="weeklyRows" style="display: grid; gap: var(--space-3);"></div>

        <div class="form-group" style="margin-top: var(--space-5);">
          <label class="form-label" data-i18n="guide.blockedDatesLabel">Blocked Dates (comma-separated YYYY-MM-DD)</label>
          <input type="text" id="blockedDatesInput" class="form-input" placeholder="2026-12-25, 2026-12-31">
        </div>
      </div>

      <!-- Real Booked Time Slots from guideBusySlots -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title" data-i18n="guide.bookedSlotsTitle">Upcoming Booked Time Slots</h2>
        </div>
        <div id="bookedSlotsList" style="display: grid; gap: var(--space-2);"></div>
      </div>

    </div>
  </main>

  <script type="module">
    import { onAuthReady, enforceRouteProtection } from '/js/auth.js';
    import { getGuideById, updateGuideAvailabilitySchedule } from '/js/guides.js';
    import { getGuideBusySlots, DEFAULT_WEEKLY_AVAILABILITY, WEEKDAY_KEYS } from '/js/availability.js';
    import { showToast, t, getLocalizedStatus } from '/js/utils.js';

    enforceRouteProtection({ allowedRoles: ['guide', 'admin'] });

    let currentGuideId = null;
    let weeklyState = JSON.parse(JSON.stringify(DEFAULT_WEEKLY_AVAILABILITY));

    function renderWeeklyRows() {
      const container = document.getElementById('weeklyRows');
      container.innerHTML = WEEKDAY_KEYS.map(day => {
        const cfg = weeklyState[day] || { enabled: true, start: '07:00', end: '23:00' };
        return `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-subtle); border-radius: var(--radius-md); flex-wrap: wrap; gap: var(--space-3);">
            <label class="checkbox-label" style="min-width: 90px;">
              <input type="checkbox" class="day-enable-cb" data-day="${day}" ${cfg.enabled ? 'checked' : ''}>
              <span style="font-weight: 700; text-transform: uppercase;">${day}</span>
            </label>
            <div style="display: flex; align-items: center; gap: 8px;">
              <input type="time" class="form-input day-start-input" data-day="${day}" value="${cfg.start || '07:00'}" style="width: 130px; min-height: 36px;">
              <span>–</span>
              <input type="time" class="form-input day-end-input" data-day="${day}" value="${cfg.end || '23:00'}" style="width: 130px; min-height: 36px;">
            </div>
          </div>
        `;
      }).join('');
    }

    function readWeeklyFromDom() {
      const result = {};
      WEEKDAY_KEYS.forEach(day => {
        const enabled = document.querySelector(`.day-enable-cb[data-day="${day}"]`)?.checked ?? true;
        const start = document.querySelector(`.day-start-input[data-day="${day}"]`)?.value || '07:00';
        const end = document.querySelector(`.day-end-input[data-day="${day}"]`)?.value || '23:00';
        result[day] = { enabled, start, end };
      });
      return result;
    }

    async function saveSchedule() {
      if (!currentGuideId) return;
      weeklyState = readWeeklyFromDom();
      const blockedDates = document.getElementById('blockedDatesInput').value
        .split(',')
        .map(s => s.trim())
        .filter(Boolean);
      const instantAvailable = document.getElementById('instantAvailableToggle').checked;

      await updateGuideAvailabilitySchedule(currentGuideId, {
        weeklyAvailability: weeklyState,
        blockedDates,
        instantAvailable
      });
      showToast(t('toasts.slotsOpened'), 'success');
    }

    onAuthReady(async (user) => {
      if (!user) return;
      currentGuideId = user.uid;

      const [guide, busySlots] = await Promise.all([
        getGuideById(currentGuideId),
        getGuideBusySlots(currentGuideId)
      ]);

      if (guide) {
        if (guide.weeklyAvailability) {
          weeklyState = { ...DEFAULT_WEEKLY_AVAILABILITY, ...guide.weeklyAvailability };
        }
        document.getElementById('instantAvailableToggle').checked = guide.instantAvailable !== false;
        if (Array.isArray(guide.blockedDates)) {
          document.getElementById('blockedDatesInput').value = guide.blockedDates.join(', ');
        }
      }
      renderWeeklyRows();

      const slotsEl = document.getElementById('bookedSlotsList');
      if (busySlots.length === 0) {
        slotsEl.innerHTML = `<p style="font-size: 0.875rem; color: var(--text-muted);">${t('guide.noBookedSlots')}</p>`;
      } else {
        slotsEl.innerHTML = busySlots.map(s => `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: var(--bg-subtle); border-radius: var(--radius-md);">
            <div>
              <strong>${s.date}</strong> · <span>${s.startTime} – ${s.endTime}</span>
            </div>
            <span class="badge badge-online">${getLocalizedStatus(s.status)}</span>
          </div>
        `).join('');
      }
    });

    document.getElementById('openAllBtn').addEventListener('click', () => {
      weeklyState = JSON.parse(JSON.stringify(DEFAULT_WEEKLY_AVAILABILITY));
      renderWeeklyRows();
      saveSchedule();
    });

    document.getElementById('saveScheduleBtn').addEventListener('click', saveSchedule);
  </script>
</body>
</html>
