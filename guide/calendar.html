<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Availability Calendar — TourGuide</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/guide.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="app-container header-inner">
      <a href="/guide/index.html" class="brand-logo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>
        <span>TourGuide</span>
        <span class="brand-badge">CAPTAIN</span>
      </a>

      <nav class="nav-links">
        <a href="/guide/index.html" class="nav-link" data-i18n="nav.overview">Overview</a>
        <a href="/guide/requests.html" class="nav-link" data-i18n="nav.requests">Requests</a>
        <a href="/guide/calendar.html" class="nav-link active" data-i18n="nav.calendar">Calendar</a>
        <a href="/guide/earnings.html" class="nav-link" data-i18n="nav.earnings">Earnings</a>
        <a href="/guide/profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
      </nav>

      <div class="header-actions"></div>
    </div>
  </header>

  <main class="main-content">
    <div class="app-container" style="max-width: 900px;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6);">
        <h1 style="font-size: 1.5rem; font-weight: 800;" data-i18n="guide.calendarTitle">Availability & Schedule</h1>
        <button id="openAllBtn" class="btn btn-outline btn-sm" data-i18n="guide.quickOpenAll">Quick Open All</button>
      </div>

      <div class="card">
        <div class="card-header">
          <h2 class="card-title" data-i18n="guide.weeklySlotsTitle">Weekly Dispatch Slots</h2>
          <span style="font-size: 0.8rem; color: var(--text-muted);">Instant & Scheduled</span>
        </div>

        <div style="display: grid; gap: var(--space-3);">
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-subtle); border-radius: var(--radius-md);">
            <div>
              <span style="font-weight: 700; font-size: 0.95rem;">Today</span>
              <span style="font-size: 0.8rem; color: var(--text-muted); display: block;">9:00 AM – 6:00 PM</span>
            </div>
            <span class="badge badge-online" data-i18n="guide.availableForInstant">Available for Instant</span>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-subtle); border-radius: var(--radius-md);">
            <div>
              <span style="font-weight: 700; font-size: 0.95rem;">Tomorrow</span>
              <span style="font-size: 0.8rem; color: var(--text-muted); display: block;">9:00 AM – 5:00 PM</span>
            </div>
            <span class="badge badge-online" data-i18n="guide.availableForInstant">Available for Instant</span>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-subtle); border-radius: var(--radius-md);">
            <div>
              <span style="font-weight: 700; font-size: 0.95rem;">Weekend</span>
              <span style="font-size: 0.8rem; color: var(--text-muted); display: block;">Afternoon & Sunset Tours</span>
            </div>
            <span class="badge badge-gray">Scheduled Only</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script type="module">
    import { enforceRouteProtection } from '/js/auth.js';
    import { showToast, t } from '/js/utils.js';

    enforceRouteProtection({ allowedRoles: ['guide', 'admin'] });

    document.getElementById('openAllBtn').addEventListener('click', () => {
      showToast(t('toasts.slotsOpened'), 'success');
    });
  </script>
</body>
</html>
