<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Log in — TourGuide</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="app-container header-inner">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>
        <span>TourGuide</span>
      </a>

      <div class="header-actions">
        <a href="/register.html" class="btn btn-outline btn-sm" data-i18n="nav.register">Sign up</a>
      </div>
    </div>
  </header>

  <!-- Login Form Wrapper -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title" data-i18n="auth.welcomeBack">Welcome back</h1>
        <p class="auth-subtitle" data-i18n="auth.loginSubtitle">Log in to manage your tours and bookings</p>
      </div>

      <!-- Google Button -->
      <button type="button" id="googleLoginBtn" class="btn-google">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
        <span id="googleBtnText" data-i18n="auth.continueWithGoogle">Continue with Google</span>
      </button>

      <div class="auth-divider">
        <span data-i18n="auth.orEmail">or log in with email</span>
      </div>

      <!-- Alert message container -->
      <div id="authAlert" style="display: none; padding: 10px 14px; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: var(--space-4);"></div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="emailInput" data-i18n="auth.emailLabel">Email address</label>
          <input type="email" id="emailInput" class="form-input" placeholder="name@example.com" data-i18n-placeholder="auth.emailPlaceholder" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput" data-i18n="auth.passwordLabel">Password</label>
          <input type="password" id="passwordInput" class="form-input" placeholder="Enter your password" data-i18n-placeholder="auth.passwordPlaceholder" required autocomplete="current-password">
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe">
            <span data-i18n="auth.rememberMe">Remember me</span>
          </label>
          <button type="button" id="forgotPasswordBtn" class="forgot-link" style="background: none; border: none; cursor: pointer; padding: 0;" data-i18n="auth.forgotPassword">Forgot password?</button>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg">
          <span id="btnText" data-i18n="auth.logInBtn">Log in</span>
          <span id="btnSpinner" class="spinner" style="display: none; width: 18px; height: 18px; border-width: 2px; border-top-color: white;"></span>
        </button>
      </form>

      <div class="auth-footer">
        <span data-i18n="auth.dontHaveAccount">Don't have an account?</span> <a href="/register.html" data-i18n="auth.createAccountLink">Create account</a>
      </div>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgotModal" class="modal-backdrop" style="display: none;">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 style="font-size: 1.1rem; font-weight: 700;" data-i18n="auth.resetTitle">Reset Password</h3>
        <button type="button" id="closeForgotModal" style="color: var(--text-muted);">&times;</button>
      </div>
      <div class="modal-body">
        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: var(--space-4);" data-i18n="auth.resetSubtitle">
          Enter your registered email address and we will send you a password reset link.
        </p>
        <div class="form-group">
          <label class="form-label" for="resetEmailInput" data-i18n="auth.yourEmail">Your Email</label>
          <input type="email" id="resetEmailInput" class="form-input" placeholder="name@example.com" data-i18n-placeholder="auth.emailPlaceholder">
        </div>
        <div id="resetAlert" style="display: none; padding: 10px; border-radius: var(--radius-sm); font-size: 0.825rem; margin-top: 10px;"></div>
      </div>
      <div class="modal-footer">
        <button type="button" id="cancelResetBtn" class="btn btn-outline btn-sm" data-i18n="auth.cancel">Cancel</button>
        <button type="button" id="sendResetBtn" class="btn btn-primary btn-sm" data-i18n="auth.sendResetBtn">Send Reset Email</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { login, loginWithGoogle, sendResetPassword, redirectByRole } from '/js/auth.js';
    import { showToast, getUrlParam, t } from '/js/utils.js';

    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const authAlert = document.getElementById('authAlert');

    function showAlert(msg, isError = true) {
      authAlert.style.display = 'block';
      authAlert.style.background = isError ? 'var(--error-bg)' : 'var(--success-bg)';
      authAlert.style.color = isError ? 'var(--error)' : 'var(--success)';
      authAlert.style.border = `1px solid ${isError ? 'var(--error-border)' : 'var(--success-border)'}`;
      authAlert.textContent = msg;
    }

    function clearAlert() {
      authAlert.style.display = 'none';
      authAlert.textContent = '';
    }

    // Email/Password Submit
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';

      try {
        const { user, profile } = await login(emailInput.value, passwordInput.value);
        showToast(t('toasts.loginSuccess', { name: profile.firstName || user.email }), 'success');
        
        const redirect = getUrlParam('redirect');
        setTimeout(() => {
          if (redirect) {
            window.location.href = redirect;
          } else {
            redirectByRole(profile);
          }
        }, 300);
      } catch (err) {
        showAlert(err.message, true);
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });

    // Google Sign In
    const googleBtn = document.getElementById('googleLoginBtn');
    const googleBtnText = document.getElementById('googleBtnText');

    googleBtn.addEventListener('click', async () => {
      clearAlert();
      googleBtn.disabled = true;
      googleBtnText.textContent = t('auth.connectingGoogle');

      try {
        const { user, profile } = await loginWithGoogle();
        showToast(t('toasts.googleLoginSuccess'), 'success');
        
        const redirect = getUrlParam('redirect');
        setTimeout(() => {
          if (redirect) {
            window.location.href = redirect;
          } else {
            redirectByRole(profile);
          }
        }, 300);
      } catch (err) {
        showAlert(err.message, true);
        googleBtn.disabled = false;
        googleBtnText.textContent = t('auth.continueWithGoogle');
      }
    });

    // Forgot Password Modal
    const forgotModal = document.getElementById('forgotModal');
    const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
    const closeForgotModal = document.getElementById('closeForgotModal');
    const cancelResetBtn = document.getElementById('cancelResetBtn');
    const sendResetBtn = document.getElementById('sendResetBtn');
    const resetEmailInput = document.getElementById('resetEmailInput');
    const resetAlert = document.getElementById('resetAlert');

    forgotPasswordBtn.addEventListener('click', () => {
      resetEmailInput.value = emailInput.value || '';
      resetAlert.style.display = 'none';
      forgotModal.style.display = 'flex';
    });

    closeForgotModal.addEventListener('click', () => forgotModal.style.display = 'none');
    cancelResetBtn.addEventListener('click', () => forgotModal.style.display = 'none');

    sendResetBtn.addEventListener('click', async () => {
      const email = resetEmailInput.value.trim();
      if (!email) {
        resetAlert.style.display = 'block';
        resetAlert.style.background = 'var(--error-bg)';
        resetAlert.style.color = 'var(--error)';
        resetAlert.textContent = t('auth.emailLabel');
        return;
      }

      sendResetBtn.disabled = true;
      sendResetBtn.textContent = t('auth.sending');

      try {
        await sendResetPassword(email);
        resetAlert.style.display = 'block';
        resetAlert.style.background = 'var(--success-bg)';
        resetAlert.style.color = 'var(--success)';
        resetAlert.textContent = t('toasts.passwordResetSent');
        setTimeout(() => {
          forgotModal.style.display = 'none';
          sendResetBtn.disabled = false;
          sendResetBtn.textContent = t('auth.sendResetBtn');
        }, 2000);
      } catch (err) {
        resetAlert.style.display = 'block';
        resetAlert.style.background = 'var(--error-bg)';
        resetAlert.style.color = 'var(--error)';
        resetAlert.textContent = err.message;
        sendResetBtn.disabled = false;
        sendResetBtn.textContent = t('auth.sendResetBtn');
      }
    });
  </script>
</body>
</html>
