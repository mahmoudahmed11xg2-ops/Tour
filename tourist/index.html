<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="app-root" content="../">
  <title>Home | TourGuide</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/tourist.css">
</head>
<body class="protected-page">

  <!-- Tourist Header (Strict Role Isolation: Home, Explore, Bookings, Messages, Profile — NO Guide/Admin links) -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="./index.html" class="brand-wordmark">
          <span class="brand-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <circle cx="12" cy="10" r="3"></circle>
              <path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 6.9 8 11.7z"></path>
            </svg>
          </span>
          <span data-i18n="brand.name">TourGuide</span>
        </a>
      </div>

      <nav class="header-nav" aria-label="Tourist Navigation">
        <a href="./index.html" class="nav-link active" data-i18n="nav.home">Home</a>
        <a href="./explore.html" class="nav-link" data-i18n="nav.explore">Explore</a>
        <a href="./bookings.html" class="nav-link" data-i18n="nav.bookings">Bookings</a>
        <a href="./messages.html" class="nav-link" data-i18n="nav.messages">Messages</a>
        <a href="./profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
      </nav>

      <div class="header-actions">
        <button type="button" class="lang-toggle-btn" aria-label="Toggle language">
          <span class="lang-label">العربية</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container page-main">
    <!-- Active Tour Banner (rendered dynamically when an active booking exists) -->
    <div id="activeTourBanner" class="active-tour-banner" style="display:none;">
      <p id="activeTourText"></p>
      <a id="activeTourLink" href="./bookings.html" class="btn btn-accent btn-sm" data-i18n="booking.trackTourBtn">Track Tour</a>
    </div>

    <!-- Streamlined Progressive Mobile-First Search Card -->
    <section class="tourist-search-card" aria-labelledby="searchCardHeading">
      <h1 id="searchCardHeading" class="tourist-search-title" data-i18n="search.whereTo">Where are you going?</h1>

      <div class="segmented-control" role="tablist" style="margin-bottom:14px;">
        <button type="button" class="segmented-btn active" data-mode="instant" data-i18n="search.findGuideNow">Now</button>
        <button type="button" class="segmented-btn" data-mode="scheduled" data-i18n="search.scheduleGuide">Schedule</button>
      </div>

      <div class="form-grid-2">
        <div class="form-group" style="margin-bottom:0;">
          <label for="searchLocation" class="form-label" data-i18n="search.currentLocation">Current location</label>
          <input type="text" id="searchLocation" class="form-control" value="Giza" placeholder="Giza, Cairo, Luxor">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="searchDestination" class="form-label" data-i18n="search.destination">Destination</label>
          <input type="text" id="searchDestination" class="form-control" value="Pyramids" placeholder="Pyramids, Museum, Karnak">
        </div>
      </div>

      <!-- Scheduled Date & Time (shown when Schedule mode active) -->
      <div id="scheduleFields" class="form-grid-2" style="display:none; margin-top:12px;">
        <div class="form-group" style="margin-bottom:0;">
          <label for="searchDate" class="form-label" data-i18n="booking.date">Date</label>
          <input type="date" id="searchDate" class="form-control">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="searchTime" class="form-label" data-i18n="booking.startTime">Start Time</label>
          <input type="time" id="searchTime" class="form-control" value="10:00">
        </div>
      </div>

      <!-- Progressive Optional Filters -->
      <div id="advancedOptions" class="search-advanced-panel" style="display:none;">
        <div class="form-grid-3">
          <div class="form-group" style="margin-bottom:0;">
            <label for="searchCategory" class="form-label" data-i18n="search.categoryLabel">Tour specialty</label>
            <select id="searchCategory" class="form-control">
              <option value="all" data-i18n="search.allCategories">All</option>
              <option value="History" data-i18n="search.categoryHistory">History</option>
              <option value="Architecture" data-i18n="search.categoryArchitecture">Architecture</option>
              <option value="Food" data-i18n="search.categoryFood">Food</option>
              <option value="Local Experience" data-i18n="search.categoryLocal">Local Experience</option>
              <option value="Museum" data-i18n="search.categoryMuseum">Museum</option>
              <option value="Desert" data-i18n="search.categoryDesert">Desert</option>
              <option value="Family" data-i18n="search.categoryFamily">Family</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label for="searchLanguage" class="form-label" data-i18n="search.languageLabel">Language</label>
            <select id="searchLanguage" class="form-control">
              <option value="all" data-i18n="search.anyLanguage">Any Language</option>
              <option value="English">English</option>
              <option value="Arabic">Arabic</option>
              <option value="French">French</option>
              <option value="German">German</option>
              <option value="Spanish">Spanish</option>
              <option value="Italian">Italian</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label for="searchDuration" class="form-label" data-i18n="search.durationLabel">Duration</label>
            <select id="searchDuration" class="form-control">
              <option value="2" data-i18n="durations.2">2 hrs</option>
              <option value="3" selected data-i18n="durations.3">3 hrs</option>
              <option value="4" data-i18n="durations.4">4 hrs</option>
              <option value="6" data-i18n="durations.6">6 hrs</option>
              <option value="8" data-i18n="durations.8">8 hrs</option>
            </select>
          </div>
        </div>
      </div>

      <div class="search-actions-row">
        <button type="button" id="findGuideBtn" class="btn btn-primary" style="flex:1;" data-i18n="search.findGuideBtn">Find a Guide</button>
        <button type="button" id="instantMatchBtn" class="btn btn-accent" data-i18n="search.requestBestMatchBtn">Instant Match</button>
        <button type="button" id="toggleOptionsBtn" class="btn btn-outline" data-i18n="search.moreOptions">More options</button>
      </div>
    </section>

    <!-- Results Header -->
    <div class="explore-toolbar">
      <div>
        <h2 class="card-title" data-i18n="search.availableVerified">Available Verified Guides</h2>
        <p class="form-hint" data-i18n="search.realTimeReady">Real-time availability checked</p>
      </div>
      <a href="./explore.html" class="btn btn-outline btn-sm" data-i18n="explore.viewAll">View All</a>
    </div>

    <!-- Matched Guides Grid -->
    <div id="guidesResultsGrid" class="guides-grid"></div>
  </main>

  <!-- Tourist 5-Item Mobile Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Tourist Mobile Navigation">
    <a href="./index.html" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span data-i18n="nav.home">Home</span>
    </a>
    <a href="./explore.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span data-i18n="nav.explore">Explore</span>
    </a>
    <a href="./bookings.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line></svg>
      <span data-i18n="nav.bookings">Bookings</span>
    </a>
    <a href="./messages.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      <span data-i18n="nav.messages">Messages</span>
    </a>
    <a href="./profile.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span data-i18n="nav.profile">Profile</span>
    </a>
  </nav>

  <script type="module">
    import { enforceRouteProtection, getCurrentUser, onAuthReady } from '../js/auth.js';
    import { matchGuides } from '../js/matching.js';
    import { createBooking, getActiveBookingForTourist } from '../js/booking.js';
    import {
      applyTranslations,
      setupLanguageToggle,
      showToast,
      t,
      getTodayISODate,
      getCurrentTimeHHMM,
      formatCurrency,
      resolveAvatar,
      escapeHtml,
      getLocalizedStatus
    } from '../js/utils.js';

    enforceRouteProtection({ allowedRoles: ['tourist', 'admin'] });
    applyTranslations();
    setupLanguageToggle();

    let bookingMode = 'instant';
    let lastMatches = [];

    const dateInput = document.getElementById('searchDate');
    dateInput.value = getTodayISODate();
    dateInput.min = getTodayISODate();

    // Mode toggle (Now vs Schedule)
    document.querySelectorAll('.segmented-btn[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => {
        bookingMode = btn.dataset.mode;
        document.querySelectorAll('.segmented-btn[data-mode]').forEach(b => b.classList.toggle('active', b === btn));
        document.getElementById('scheduleFields').style.display = bookingMode === 'scheduled' ? 'grid' : 'none';
        runSearch();
      });
    });

    // Progressive advanced options toggle
    const toggleBtn = document.getElementById('toggleOptionsBtn');
    const advPanel = document.getElementById('advancedOptions');
    toggleBtn.addEventListener('click', () => {
      const open = advPanel.style.display === 'block';
      advPanel.style.display = open ? 'none' : 'block';
      toggleBtn.textContent = open ? t('search.moreOptions') : t('search.hideOptions');
    });

    function buildBookingQueryString(guideId) {
      const params = new URLSearchParams({
        guideId,
        type: bookingMode,
        location: document.getElementById('searchLocation').value.trim() || 'Giza',
        destination: document.getElementById('searchDestination').value.trim() || 'Pyramids',
        duration: document.getElementById('searchDuration').value || '3',
        language: document.getElementById('searchLanguage').value || 'English',
        specialty: document.getElementById('searchCategory').value || 'all',
        date: bookingMode === 'scheduled' ? (dateInput.value || getTodayISODate()) : getTodayISODate(),
        time: bookingMode === 'scheduled' ? (document.getElementById('searchTime').value || '10:00') : getCurrentTimeHHMM()
      });
      return params.toString();
    }

    function renderGuides(matches) {
      const grid = document.getElementById('guidesResultsGrid');
      if (!matches.length) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <h3>${escapeHtml(t('search.noGuidesFound'))}</h3>
            <p>${escapeHtml(t('search.noGuidesFoundDesc'))}</p>
            <button type="button" id="switchScheduleBtn" class="btn btn-outline">${escapeHtml(t('search.scheduleGuideBtn'))}</button>
          </div>
        `;
        document.getElementById('switchScheduleBtn')?.addEventListener('click', () => {
          document.querySelector('.segmented-btn[data-mode="scheduled"]').click();
        });
        return;
      }

      grid.innerHTML = matches.map(({ guide, distanceKm }) => {
        const avatar = resolveAvatar(guide.avatar, guide.name);
        const langs = Array.isArray(guide.languages) ? guide.languages.join(', ') : '';
        const city = escapeHtml(guide.city || 'Egypt');
        return `
          <article class="guide-card">
            <div class="guide-card-top">
              <img src="${avatar}" alt="${escapeHtml(guide.name)}" class="guide-avatar" referrerpolicy="no-referrer">
              <div class="guide-info">
                <div class="guide-name-row">
                  <h3 class="guide-name">${escapeHtml(guide.name)}</h3>
                  <span class="guide-rating">&#9733; ${Number(guide.rating || 4.8).toFixed(1)}</span>
                </div>
                <div class="meta-inline">
                  <span>${city}</span>
                  <span class="meta-sep">&middot;</span>
                  <span class="tabular-nums">${Number(guide.experienceYears || 3)} ${escapeHtml(t('search.yearsExp'))}</span>
                  <span class="meta-sep">&middot;</span>
                  <span class="tabular-nums">${Number(distanceKm || 3).toFixed(1)} ${escapeHtml(t('search.kmAway'))}</span>
                </div>
                <div class="meta-inline" style="margin-top:2px;">
                  <span>${escapeHtml(t('search.verifiedBadge'))}</span>
                  ${langs ? `<span class="meta-sep">&middot;</span><span>${escapeHtml(langs)}</span>` : ''}
                </div>
              </div>
            </div>
            <p class="guide-bio">${escapeHtml(guide.about || '')}</p>
            <div class="guide-card-footer">
              <div class="guide-price">${formatCurrency(guide.hourlyRate || 25)}<span>${escapeHtml(t('search.perHour'))}</span></div>
              <div class="guide-card-actions">
                <a href="./profile.html?id=${encodeURIComponent(guide.id)}" class="btn btn-outline btn-sm">${escapeHtml(t('search.viewProfile'))}</a>
                <a href="./booking.html?${buildBookingQueryString(guide.id)}" class="btn btn-primary btn-sm">${escapeHtml(t('search.bookGuide'))}</a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    async function runSearch() {
      const location = document.getElementById('searchLocation').value.trim() || 'all';
      const language = document.getElementById('searchLanguage').value;
      const specialty = document.getElementById('searchCategory').value;
      const durationHours = Number(document.getElementById('searchDuration').value || 3);
      const isInstant = bookingMode === 'instant';
      const date = isInstant ? getTodayISODate() : (dateInput.value || getTodayISODate());
      const startTime = isInstant ? getCurrentTimeHHMM() : (document.getElementById('searchTime').value || '10:00');

      lastMatches = await matchGuides({
        location,
        language,
        specialty,
        date,
        startTime,
        durationHours,
        isInstant
      });
      renderGuides(lastMatches);
    }

    document.getElementById('findGuideBtn').addEventListener('click', runSearch);

    document.getElementById('instantMatchBtn').addEventListener('click', async () => {
      const user = getCurrentUser();
      if (!user) return;
      await runSearch();
      if (!lastMatches.length) {
        showToast(t('booking.noGuideAvailableTitle'), 'info');
        return;
      }

      const best = lastMatches[0].guide;
      const durationHours = Number(document.getElementById('searchDuration').value || 3);
      const language = document.getElementById('searchLanguage').value === 'all' ? 'English' : document.getElementById('searchLanguage').value;
      const specialty = document.getElementById('searchCategory').value === 'all' ? 'History' : document.getElementById('searchCategory').value;
      const isInstant = bookingMode === 'instant';

      try {
        const booking = await createBooking({
          guideId: best.id,
          guideName: best.name,
          touristId: user.uid,
          touristName: `${user.firstName || 'Traveler'} ${user.lastName || ''}`.trim(),
          location: document.getElementById('searchLocation').value.trim() || best.city || 'Giza',
          destination: document.getElementById('searchDestination').value.trim() || 'Pyramids',
          date: isInstant ? getTodayISODate() : dateInput.value,
          startTime: isInstant ? getCurrentTimeHHMM() : document.getElementById('searchTime').value,
          durationHours,
          language,
          specialty,
          hourlyRate: best.hourlyRate || 25,
          bookingType: bookingMode,
          candidateGuideIds: lastMatches.map(m => m.guide.id)
        });
        showToast(t('booking.bookingRequestSentToast'), 'success');
        window.location.href = `./booking.html?id=${encodeURIComponent(booking.id)}`;
      } catch (err) {
        showToast(err.message, 'error');
      }
    });

    onAuthReady(async (user) => {
      if (!user) return;
      const active = await getActiveBookingForTourist(user.uid);
      if (active) {
        document.getElementById('activeTourBanner').style.display = 'flex';
        document.getElementById('activeTourText').textContent = t('booking.activeRideBannerTitle', {
          status: getLocalizedStatus(active.status)
        });
        document.getElementById('activeTourLink').href = `./booking.html?id=${encodeURIComponent(active.id)}`;
      }
      await runSearch();
    });

    document.addEventListener('tourguide:langchange', () => renderGuides(lastMatches));
  </script>
</body>
</html>
