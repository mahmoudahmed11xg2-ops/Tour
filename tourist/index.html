<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tourist Home — TourGuide</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/tourist.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="app-container header-inner">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>
        <span>TourGuide</span>
      </a>

      <nav class="nav-links">
        <a href="/tourist/index.html" class="nav-link active" data-i18n="nav.home">Home</a>
        <a href="/tourist/explore.html" class="nav-link" data-i18n="nav.explore">Explore</a>
        <a href="/tourist/bookings.html" class="nav-link" data-i18n="nav.bookings">Bookings</a>
        <a href="/guide/index.html" class="nav-link" data-i18n="nav.guidePortal">Guide Portal</a>
        <a href="/admin/index.html" class="nav-link" data-i18n="nav.admin">Admin</a>
      </nav>

      <div class="header-actions">
        <!-- Auth state and language toggle injected by auth.js -->
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="app-container">

      <!-- Active Booking Alert Banner (if tourist currently has an ongoing trip) -->
      <div id="activeBookingBanner" style="display: none; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: var(--radius-lg); padding: 14px 18px; margin-bottom: var(--space-6); justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block;"></span>
          <div>
            <span style="font-size: 0.85rem; font-weight: 700; color: var(--accent);" id="activeBannerTitle">Active Tour</span>
            <span style="font-size: 0.775rem; color: var(--text-secondary); display: block;" id="activeBannerSubtitle"></span>
          </div>
        </div>
        <a id="activeBannerLink" href="/tourist/booking.html" class="btn btn-accent btn-sm" data-i18n="booking.trackTourBtn">Track Ride</a>
      </div>

      <!-- Search Hero -->
      <section class="search-hero">
        <h1 class="search-headline" data-i18n="search.whereTo">Where are you going?</h1>

        <div class="booking-mode-selector">
          <button id="modeNowBtn" class="booking-mode-btn active" data-mode="now">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            <span data-i18n="search.findGuideNow">Find a Guide Now</span>
          </button>
          <button id="modeScheduleBtn" class="booking-mode-btn" data-mode="schedule">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span data-i18n="search.scheduleGuide">Schedule a Guide</span>
          </button>
        </div>

        <div class="location-inputs">
          <div class="input-with-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"></circle><path d="M12 2a10 10 0 0 0-10 10c0 5.25 10 12 10 12s10-6.75 10-12a10 10 0 0 0-10-10z"></path></svg>
            <input type="text" id="currentLocationInput" class="form-input" value="Giza" placeholder="Current location" data-i18n-placeholder="search.currentLocation">
          </div>
          <div class="input-with-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <input type="text" id="destinationInput" class="form-input" value="Pyramids of Giza" placeholder="Where do you want to explore?" data-i18n-placeholder="search.destination">
          </div>
        </div>

        <!-- Specialties -->
        <div style="margin-bottom: 8px;">
          <label class="form-label" data-i18n="search.categoryLabel">What kind of guide?</label>
          <div class="specialty-pills" id="specialtyContainer">
            <button class="specialty-btn active" data-specialty="all" data-i18n="search.allCategories">All</button>
            <button class="specialty-btn" data-specialty="History" data-i18n="search.categoryHistory">History</button>
            <button class="specialty-btn" data-specialty="Architecture" data-i18n="search.categoryArchitecture">Architecture</button>
            <button class="specialty-btn" data-specialty="Food" data-i18n="search.categoryFood">Food</button>
            <button class="specialty-btn" data-specialty="Local Experience" data-i18n="search.categoryLocal">Local Experience</button>
            <button class="specialty-btn" data-specialty="Museum" data-i18n="search.categoryMuseum">Museum</button>
            <button class="specialty-btn" data-specialty="Desert" data-i18n="search.categoryDesert">Desert</button>
            <button class="specialty-btn" data-specialty="Family" data-i18n="search.categoryFamily">Family</button>
          </div>
        </div>

        <!-- Language & Guests -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-bottom: var(--space-5);">
          <div>
            <label class="form-label" data-i18n="search.languageLabel">Language</label>
            <select id="languageSelect" class="form-select">
              <option value="all" data-i18n="search.anyLanguage">Any Language</option>
              <option value="English" selected data-i18n="languages.en">English</option>
              <option value="Arabic" data-i18n="languages.ar">Arabic (العربية)</option>
              <option value="German" data-i18n="languages.german">German</option>
              <option value="French" data-i18n="languages.french">French</option>
              <option value="Spanish" data-i18n="languages.spanish">Spanish</option>
              <option value="Italian" data-i18n="languages.italian">Italian</option>
            </select>
          </div>
          <div>
            <label class="form-label" data-i18n="search.guestsLabel">Guests</label>
            <select id="guestsSelect" class="form-select">
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="6">6+</option>
            </select>
          </div>
        </div>

        <button id="findGuidesBtn" class="btn btn-primary btn-block btn-lg" data-i18n="search.findGuideBtn">
          Find a Guide
        </button>
      </section>

      <!-- Results -->
      <section>
        <div class="results-header">
          <h2 class="results-count" id="resultsCount" data-i18n="search.availableVerified">Available Verified Guides</h2>
          <span style="font-size: 0.8rem; color: var(--text-muted);" data-i18n="search.realTimeReady">Real-time dispatch ready</span>
        </div>

        <div id="guidesList" class="guide-list"></div>
      </section>

    </div>
  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="/tourist/index.html" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
      <span data-i18n="nav.home">Home</span>
    </a>
    <a href="/tourist/explore.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span data-i18n="nav.explore">Explore</span>
    </a>
    <a href="/tourist/bookings.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span data-i18n="nav.bookings">Bookings</span>
    </a>
    <a href="/tourist/profile.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span data-i18n="nav.profile">Profile</span>
    </a>
  </nav>

  <script type="module">
    import { fetchGuides } from '/js/guides.js';
    import { createBooking, getActiveBookingForTourist } from '/js/booking.js';
    import { getCurrentUser, onAuthReady } from '/js/auth.js';
    import { showToast, t, getLocalizedStatus } from '/js/utils.js';

    let activeMode = 'now';
    let selectedSpecialty = 'all';

    const modeNowBtn = document.getElementById('modeNowBtn');
    const modeScheduleBtn = document.getElementById('modeScheduleBtn');
    
    modeNowBtn.addEventListener('click', () => {
      activeMode = 'now';
      modeNowBtn.classList.add('active');
      modeScheduleBtn.classList.remove('active');
      renderGuides();
    });

    modeScheduleBtn.addEventListener('click', () => {
      activeMode = 'schedule';
      modeScheduleBtn.classList.add('active');
      modeNowBtn.classList.remove('active');
      renderGuides();
    });

    document.querySelectorAll('.specialty-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.specialty-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        selectedSpecialty = e.target.getAttribute('data-specialty');
        renderGuides();
      });
    });

    // Check for ongoing booking
    async function checkActiveBooking() {
      const user = getCurrentUser();
      if (!user) return;
      const active = await getActiveBookingForTourist(user.uid);
      if (active) {
        const banner = document.getElementById('activeBookingBanner');
        banner.style.display = 'flex';
        document.getElementById('activeBannerTitle').textContent = t('booking.activeRideBannerTitle', { status: getLocalizedStatus(active.status) });
        document.getElementById('activeBannerSubtitle').textContent = `${active.location} · ${active.guideName}`;
        document.getElementById('activeBannerLink').href = `/tourist/booking.html?id=${active.id}`;
      }
    }

    const guidesList = document.getElementById('guidesList');
    const resultsCount = document.getElementById('resultsCount');

    async function renderGuides() {
      guidesList.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
      
      const city = document.getElementById('currentLocationInput').value || 'Giza';
      const language = document.getElementById('languageSelect').value;

      const guides = await fetchGuides({
        city: city === 'All' ? null : city,
        language: language,
        specialty: selectedSpecialty,
        onlineOnly: activeMode === 'now',
        verifiedOnly: true
      });

      resultsCount.textContent = `${guides.length} ${t('search.verifiedBadge')}`;

      if (guides.length === 0) {
        guidesList.innerHTML = `
          <div class="empty-state">
            <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            <div class="empty-state-title">${t('search.noGuidesFound')}</div>
            <div class="empty-state-desc">${t('search.noGuidesFoundDesc')}</div>
          </div>
        `;
        return;
      }

      guidesList.innerHTML = guides.map(guide => `
        <div class="guide-card">
          <div class="guide-card-top">
            <img src="${guide.avatar}" alt="${guide.name}" class="guide-avatar">
            <div class="guide-info">
              <div class="guide-name-row">
                <span class="guide-name">${guide.name}</span>
                <span class="rating-pill">
                  <span class="rating-star">★</span>
                  <span>${guide.rating ? guide.rating.toFixed(1) : '4.9'}</span>
                  <span style="font-weight: 400; color: var(--text-muted); font-size: 0.75rem;">(${guide.reviewsCount || 0})</span>
                </span>
              </div>

              <div class="guide-meta-inline">
                <span class="badge badge-verified">✓ ${t('search.verifiedBadge')}</span>
                <span>·</span>
                <span>${guide.experienceYears || 1} ${t('search.yearsExp')}</span>
                <span>·</span>
                <span>${guide.distanceKm || 2.4} ${t('search.kmAway')}</span>
              </div>

              <div class="guide-languages">
                ${Array.isArray(guide.languages) ? guide.languages.join(' · ')}
              </div>
            </div>
          </div>

          <div class="guide-card-bottom">
            <div>
              <span class="guide-price-unit">${t('search.fromPrice')} </span>
              <span class="guide-price">$${guide.hourlyRate}</span>
              <span class="guide-price-unit">${t('search.perHour')}</span>
            </div>

            <div class="guide-actions">
              <a href="/tourist/profile.html?id=${guide.id}" class="btn btn-outline btn-sm">${t('search.viewProfile')}</a>
              <button class="btn btn-primary btn-sm book-guide-btn" data-guide-id="${guide.id}" data-guide-name="${guide.name}" data-guide-rate="${guide.hourlyRate}">
                ${t('search.bookGuide')}
              </button>
            </div>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.book-guide-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const user = getCurrentUser();
          const guideId = e.currentTarget.getAttribute('data-guide-id');
          const guideName = e.currentTarget.getAttribute('data-guide-name');
          const rate = Number(e.currentTarget.getAttribute('data-guide-rate'));

          if (!user) {
            showToast(t('toasts.authRequired'), 'info');
            setTimeout(() => {
              window.location.href = `/login.html?redirect=${encodeURIComponent(window.location.pathname)}`;
            }, 500);
            return;
          }

          const destination = document.getElementById('destinationInput').value || 'Pyramids of Giza';
          const guests = document.getElementById('guestsSelect').value;
          const language = document.getElementById('languageSelect').value;

          const booking = await createBooking({
            guideId,
            guideName,
            touristId: user.uid,
            touristName: `${user.firstName || 'Traveler'} ${user.lastName || ''}`.trim(),
            location: destination,
            durationHours: 2,
            language: language === 'all' ? 'English' : language,
            guests,
            hourlyRate: rate,
            type: activeMode === 'now' ? 'instant' : 'scheduled'
          });

          showToast(t('booking.bookingConfirmedToast'), 'success');
          setTimeout(() => {
            window.location.href = `/tourist/booking.html?id=${booking.id}`;
          }, 400);
        });
      });
    }

    document.getElementById('findGuidesBtn').addEventListener('click', renderGuides);
    document.getElementById('languageSelect').addEventListener('change', renderGuides);

    document.addEventListener('tourguide:langchange', () => {
      checkActiveBooking();
      renderGuides();
    });

    onAuthReady((user) => {
      if (user) checkActiveBooking();
    });
    renderGuides();
  </script>
</body>
</html>
