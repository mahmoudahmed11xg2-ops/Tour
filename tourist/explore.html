<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="app-root" content="../">
  <title>Explore Guides | TourGuide</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/tourist.css">
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js",
      "firebase/analytics": "https://www.gstatic.com/firebasejs/13.4.0/firebase-analytics.js"
    }
  }
  </script>
</head>
<body class="protected-page">

  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="./index.html" class="brand-wordmark">
          <span class="brand-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <circle cx="12" cy="10" r="3"></circle>
              <path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 6.9 8 11.7z"></path>
            </svg>
          </span>
          <span data-i18n="brand.name">TourGuide</span>
        </a>
      </div>

      <nav class="header-nav" aria-label="Tourist Navigation">
        <a href="./index.html" class="nav-link" data-i18n="nav.home">Home</a>
        <a href="./explore.html" class="nav-link active" data-i18n="nav.explore">Explore</a>
        <a href="./bookings.html" class="nav-link" data-i18n="nav.bookings">Bookings</a>
        <a href="./messages.html" class="nav-link" data-i18n="nav.messages">Messages</a>
        <a href="./profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
      </nav>

      <div class="header-actions">
        <button type="button" class="lang-toggle-btn" aria-label="Toggle language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label">English</span>
        </button>
        <span id="authHeaderSlot" class="auth-header-slot"></span>
      </div>
    </div>
  </header>

  <main class="container page-main">
    <div class="explore-toolbar">
      <div>
        <h1 class="page-title" data-i18n="explore.title">Explore Guides</h1>
        <p class="page-subtitle" data-i18n="explore.subtitle">Browse verified local experts across Egypt</p>
      </div>
      <button type="button" id="openFiltersSheetBtn" class="btn btn-outline show-mobile" data-i18n="explore.filtersBtn">Filters</button>
    </div>

    <!-- Desktop Compact Filter Bar -->
    <section class="desktop-filter-bar" aria-label="Guide Filters">
      <div class="form-grid-3">
        <div class="form-group" style="margin-bottom:0;">
          <label for="fCity" class="form-label" data-i18n="explore.filterCity">City</label>
          <select id="fCity" class="form-control">
            <option value="all" data-i18n="explore.filterAllCities">All Cities</option>
            <option value="Giza" data-i18n="cities.giza">Giza</option>
            <option value="Cairo" data-i18n="cities.cairo">Cairo</option>
            <option value="Luxor" data-i18n="cities.luxor">Luxor</option>
            <option value="Aswan" data-i18n="cities.aswan">Aswan</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="fLanguage" class="form-label" data-i18n="explore.filterLanguage">Language</label>
          <select id="fLanguage" class="form-control">
            <option value="all" data-i18n="search.anyLanguage">Any Language</option>
            <option value="English" data-i18n="languages.english">English</option>
            <option value="Arabic" data-i18n="languages.arabic">Arabic</option>
            <option value="French" data-i18n="languages.french">French</option>
            <option value="German" data-i18n="languages.german">German</option>
            <option value="Spanish" data-i18n="languages.spanish">Spanish</option>
            <option value="Italian" data-i18n="languages.italian">Italian</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="fSpecialty" class="form-label" data-i18n="explore.filterSpecialty">Specialty</label>
          <select id="fSpecialty" class="form-control">
            <option value="all" data-i18n="explore.filterAllSpecialties">All Specialties</option>
            <option value="History" data-i18n="search.categoryHistory">History</option>
            <option value="Architecture" data-i18n="search.categoryArchitecture">Architecture</option>
            <option value="Food" data-i18n="search.categoryFood">Food</option>
            <option value="Local Experience" data-i18n="search.categoryLocal">Local Experience</option>
            <option value="Museum" data-i18n="search.categoryMuseum">Museum</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="fDate" class="form-label" data-i18n="explore.filterDate">Date</label>
          <input type="date" id="fDate" class="form-control">
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="fMaxPrice" class="form-label" data-i18n="explore.filterMaxPrice">Max Price / hr</label>
          <select id="fMaxPrice" class="form-control">
            <option value="" data-i18n="explore.filterAnyPrice">Any Price</option>
            <option value="25">$25</option>
            <option value="35">$35</option>
            <option value="50">$50</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="fSort" class="form-label" data-i18n="explore.filterSort">Sort By</label>
          <select id="fSort" class="form-control">
            <option value="recommended" data-i18n="explore.sortRecommended">Recommended</option>
            <option value="rating" data-i18n="explore.sortRating">Highest Rating</option>
            <option value="price" data-i18n="explore.sortPrice">Lowest Price</option>
            <option value="distance" data-i18n="explore.sortDistance">Nearest Distance</option>
          </select>
        </div>
      </div>
    </section>

    <div id="exploreGuidesGrid" class="guides-grid"></div>
  </main>

  <!-- Mobile Bottom Sheet Filters -->
  <div id="filtersSheetBackdrop" class="bottom-sheet-backdrop" role="dialog" aria-modal="true">
    <div class="bottom-sheet">
      <div class="bottom-sheet-header">
        <h3 class="card-title" data-i18n="explore.filtersBtn">Filters</h3>
        <button type="button" id="closeFiltersSheetBtn" class="modal-close-btn" aria-label="Close">&times;</button>
      </div>
      <div class="bottom-sheet-body">
        <div class="form-group">
          <label for="mCity" class="form-label" data-i18n="explore.filterCity">City</label>
          <select id="mCity" class="form-control">
            <option value="all" data-i18n="explore.filterAllCities">All Cities</option>
            <option value="Giza" data-i18n="cities.giza">Giza</option>
            <option value="Cairo" data-i18n="cities.cairo">Cairo</option>
            <option value="Luxor" data-i18n="cities.luxor">Luxor</option>
            <option value="Aswan" data-i18n="cities.aswan">Aswan</option>
          </select>
        </div>
        <div class="form-group">
          <label for="mLanguage" class="form-label" data-i18n="explore.filterLanguage">Language</label>
          <select id="mLanguage" class="form-control">
            <option value="all" data-i18n="search.anyLanguage">Any Language</option>
            <option value="English" data-i18n="languages.english">English</option>
            <option value="Arabic" data-i18n="languages.arabic">Arabic</option>
            <option value="French" data-i18n="languages.french">French</option>
            <option value="German" data-i18n="languages.german">German</option>
            <option value="Spanish" data-i18n="languages.spanish">Spanish</option>
            <option value="Italian" data-i18n="languages.italian">Italian</option>
          </select>
        </div>
        <div class="form-group">
          <label for="mSpecialty" class="form-label" data-i18n="explore.filterSpecialty">Specialty</label>
          <select id="mSpecialty" class="form-control">
            <option value="all" data-i18n="explore.filterAllSpecialties">All Specialties</option>
            <option value="History" data-i18n="search.categoryHistory">History</option>
            <option value="Architecture" data-i18n="search.categoryArchitecture">Architecture</option>
            <option value="Food" data-i18n="search.categoryFood">Food</option>
            <option value="Local Experience" data-i18n="search.categoryLocal">Local Experience</option>
            <option value="Museum" data-i18n="search.categoryMuseum">Museum</option>
          </select>
        </div>
        <div class="form-group">
          <label for="mMaxPrice" class="form-label" data-i18n="explore.filterMaxPrice">Max Price / hr</label>
          <select id="mMaxPrice" class="form-control">
            <option value="" data-i18n="explore.filterAnyPrice">Any Price</option>
            <option value="25">$25</option>
            <option value="35">$35</option>
            <option value="50">$50</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="mSort" class="form-label" data-i18n="explore.filterSort">Sort By</label>
          <select id="mSort" class="form-control">
            <option value="recommended" data-i18n="explore.sortRecommended">Recommended</option>
            <option value="rating" data-i18n="explore.sortRating">Highest Rating</option>
            <option value="price" data-i18n="explore.sortPrice">Lowest Price</option>
            <option value="distance" data-i18n="explore.sortDistance">Nearest Distance</option>
          </select>
        </div>
      </div>
      <div class="bottom-sheet-footer">
        <button type="button" id="resetMobileFiltersBtn" class="btn btn-outline" style="flex:1;" data-i18n="explore.resetFiltersBtn">Reset</button>
        <button type="button" id="applyMobileFiltersBtn" class="btn btn-primary" style="flex:2;" data-i18n="explore.applyFiltersBtn">Show Results</button>
      </div>
    </div>
  </div>

  <!-- Tourist 5-Item Mobile Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Tourist Mobile Navigation">
    <a href="./index.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span data-i18n="nav.home">Home</span>
    </a>
    <a href="./explore.html" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span data-i18n="nav.explore">Explore</span>
    </a>
    <a href="./bookings.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line></svg>
      <span data-i18n="nav.bookings">Bookings</span>
    </a>
    <a href="./messages.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      <span data-i18n="nav.messages">Messages</span>
    </a>
    <a href="./profile.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span data-i18n="nav.profile">Profile</span>
    </a>
  </nav>

  <script type="module">
    import { enforceRouteProtection, onAuthReady } from '../js/auth.js';
    import { matchGuides } from '../js/matching.js';
    import {
      applyTranslations,
      setupLanguageToggle,
      t,
      getTodayISODate,
      formatCurrency,
      resolveAvatar,
      escapeHtml
    } from '../js/utils.js';

    enforceRouteProtection({ allowedRoles: ['tourist'] });
    applyTranslations();
    setupLanguageToggle();

    const fDate = document.getElementById('fDate');
    fDate.value = getTodayISODate();
    fDate.min = getTodayISODate();

    let latestResults = [];

    function renderGrid(matches) {
      const grid = document.getElementById('exploreGuidesGrid');
      if (!matches.length) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1 / -1;">
            <h3>${escapeHtml(t('explore.noResultsTitle'))}</h3>
            <p>${escapeHtml(t('explore.noResultsDesc'))}</p>
            <button type="button" id="resetGridBtn" class="btn btn-outline">${escapeHtml(t('explore.resetFiltersBtn'))}</button>
          </div>
        `;
        document.getElementById('resetGridBtn')?.addEventListener('click', resetFilters);
        return;
      }

      grid.innerHTML = matches.map(({ guide, availability }) => {
        const avatar = resolveAvatar(guide.avatar, guide.name);
        const langs = Array.isArray(guide.languages) ? guide.languages.join(', ') : '';
        return `
          <article class="guide-card">
            <div class="guide-card-top">
              <img src="${avatar}" alt="${escapeHtml(guide.name)}" class="guide-avatar" referrerpolicy="no-referrer">
              <div class="guide-info">
                <div class="guide-name-row">
                  <h3 class="guide-name">${escapeHtml(guide.name)}</h3>
                  <span class="guide-rating">&#9733; ${Number(guide.rating || 0).toFixed(1)}</span>
                </div>
                <div class="meta-inline">
                  <span>${escapeHtml(guide.city || 'Egypt')}</span>
                  <span class="meta-sep">&middot;</span>
                  <span class="tabular-nums">${Number(guide.experienceYears || 0)} ${escapeHtml(t('search.yearsExp'))}</span>
                  <span class="meta-sep">&middot;</span>
                  <span>${availability.available ? escapeHtml(t('explore.availableSlot')) : escapeHtml(t('explore.unavailableSlot'))}</span>
                </div>
                <div class="meta-inline" style="margin-top:2px;">
                  <span>${escapeHtml(langs)}</span>
                </div>
              </div>
            </div>
            <p class="guide-bio">${escapeHtml(guide.about || '')}</p>
            <div class="guide-card-footer">
              <div class="guide-price">${formatCurrency(guide.hourlyRate || 25)}<span>${escapeHtml(t('search.perHour'))}</span></div>
              <div class="guide-card-actions">
                <a href="./profile.html?id=${encodeURIComponent(guide.id)}" class="btn btn-outline btn-sm">${escapeHtml(t('search.viewProfile'))}</a>
                <a href="./booking.html?guideId=${encodeURIComponent(guide.id)}&type=scheduled&date=${encodeURIComponent(fDate.value || getTodayISODate())}" class="btn btn-primary btn-sm">${escapeHtml(t('search.bookGuide'))}</a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    async function loadGuides() {
      latestResults = await matchGuides({
        location: document.getElementById('fCity').value,
        language: document.getElementById('fLanguage').value,
        specialty: document.getElementById('fSpecialty').value,
        date: fDate.value || getTodayISODate(),
        maxPrice: document.getElementById('fMaxPrice').value || null,
        sortBy: document.getElementById('fSort').value,
        isInstant: false,
        includeUnavailable: true
      });
      renderGrid(latestResults);
    }

    function resetFilters() {
      document.getElementById('fCity').value = 'all';
      document.getElementById('fLanguage').value = 'all';
      document.getElementById('fSpecialty').value = 'all';
      document.getElementById('fMaxPrice').value = '';
      document.getElementById('fSort').value = 'recommended';
      document.getElementById('mCity').value = 'all';
      document.getElementById('mLanguage').value = 'all';
      document.getElementById('mSpecialty').value = 'all';
      document.getElementById('mMaxPrice').value = '';
      document.getElementById('mSort').value = 'recommended';
      loadGuides();
    }

    ['fCity', 'fLanguage', 'fSpecialty', 'fDate', 'fMaxPrice', 'fSort'].forEach(id => {
      document.getElementById(id).addEventListener('change', loadGuides);
    });

    // Bottom sheet controls
    const sheet = document.getElementById('filtersSheetBackdrop');
    document.getElementById('openFiltersSheetBtn').addEventListener('click', () => {
      document.getElementById('mCity').value = document.getElementById('fCity').value;
      document.getElementById('mLanguage').value = document.getElementById('fLanguage').value;
      document.getElementById('mSpecialty').value = document.getElementById('fSpecialty').value;
      document.getElementById('mMaxPrice').value = document.getElementById('fMaxPrice').value;
      document.getElementById('mSort').value = document.getElementById('fSort').value;
      sheet.classList.add('open');
    });
    document.getElementById('closeFiltersSheetBtn').addEventListener('click', () => sheet.classList.remove('open'));
    sheet.addEventListener('click', (e) => {
      if (e.target === sheet) sheet.classList.remove('open');
    });
    document.getElementById('applyMobileFiltersBtn').addEventListener('click', () => {
      document.getElementById('fCity').value = document.getElementById('mCity').value;
      document.getElementById('fLanguage').value = document.getElementById('mLanguage').value;
      document.getElementById('fSpecialty').value = document.getElementById('mSpecialty').value;
      document.getElementById('fMaxPrice').value = document.getElementById('mMaxPrice').value;
      document.getElementById('fSort').value = document.getElementById('mSort').value;
      sheet.classList.remove('open');
      loadGuides();
    });
    document.getElementById('resetMobileFiltersBtn').addEventListener('click', () => {
      sheet.classList.remove('open');
      resetFilters();
    });

    onAuthReady((user) => {
      if (user) loadGuides();
    });

    document.addEventListener('tourguide:langchange', () => renderGrid(latestResults));
  </script>
</body>
</html>
