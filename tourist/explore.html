<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Explore Verified Tour Guides — TourGuide</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/tourist.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="app-container header-inner">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>
        <span>TourGuide</span>
      </a>

      <nav class="nav-links">
        <a href="/tourist/index.html" class="nav-link" data-i18n="nav.home">Home</a>
        <a href="/tourist/explore.html" class="nav-link active" data-i18n="nav.explore">Explore</a>
        <a href="/tourist/bookings.html" class="nav-link" data-i18n="nav.bookings">Bookings</a>
        <a href="/guide/index.html" class="nav-link" data-i18n="nav.guidePortal">Guide Portal</a>
      </nav>

      <div class="header-actions"></div>
    </div>
  </header>

  <main class="main-content">
    <div class="app-container">

      <!-- Explore Filters Strip -->
      <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: var(--space-5); margin-bottom: var(--space-6); box-shadow: var(--shadow-subtle);">
        <h1 style="font-size: 1.35rem; font-weight: 800; margin-bottom: var(--space-4);" data-i18n="explore.title">Explore Egypt's Certified Guides</h1>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--space-3);">
          <div>
            <label class="form-label" data-i18n="explore.filterCity">Destination</label>
            <select id="filterCity" class="form-select">
              <option value="all" data-i18n="explore.filterAllCities">All Destinations</option>
              <option value="Giza">Giza</option>
              <option value="Cairo">Cairo</option>
              <option value="Luxor">Luxor</option>
              <option value="Aswan">Aswan</option>
            </select>
          </div>

          <div>
            <label class="form-label" data-i18n="explore.filterLanguage">Language</label>
            <select id="filterLanguage" class="form-select">
              <option value="all" data-i18n="search.anyLanguage">All Languages</option>
              <option value="English" data-i18n="languages.en">English</option>
              <option value="Arabic" data-i18n="languages.ar">Arabic</option>
              <option value="German" data-i18n="languages.german">German</option>
              <option value="French" data-i18n="languages.french">French</option>
              <option value="Spanish" data-i18n="languages.spanish">Spanish</option>
              <option value="Italian" data-i18n="languages.italian">Italian</option>
            </select>
          </div>

          <div>
            <label class="form-label" data-i18n="explore.filterSpecialty">Category</label>
            <select id="filterSpecialty" class="form-select">
              <option value="all" data-i18n="explore.filterAllSpecialties">All Categories</option>
              <option value="History" data-i18n="search.categoryHistory">History</option>
              <option value="Architecture" data-i18n="search.categoryArchitecture">Architecture</option>
              <option value="Museum" data-i18n="search.categoryMuseum">Museum</option>
              <option value="Food" data-i18n="search.categoryFood">Food & Culinary</option>
              <option value="Local Experience" data-i18n="search.categoryLocal">Local Experience</option>
              <option value="Desert" data-i18n="search.categoryDesert">Desert Safari</option>
            </select>
          </div>

          <div style="display: flex; align-items: flex-end;">
            <label class="checkbox-label" style="height: 44px; display: flex; align-items: center;">
              <input type="checkbox" id="filterOnlineNow">
              <span style="font-weight: 600;" data-i18n="explore.filterOnlineNow">Available Now Only</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Results Grid -->
      <div id="exploreList" class="guide-list"></div>

    </div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="bottom-nav">
    <a href="/tourist/index.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
      <span data-i18n="nav.home">Home</span>
    </a>
    <a href="/tourist/explore.html" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span data-i18n="nav.explore">Explore</span>
    </a>
    <a href="/tourist/bookings.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span data-i18n="nav.bookings">Bookings</span>
    </a>
    <a href="/tourist/profile.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span data-i18n="nav.profile">Profile</span>
    </a>
  </nav>

  <script type="module">
    import { fetchGuides } from '/js/guides.js';
    import { t } from '/js/utils.js';
    import '/js/auth.js';

    const list = document.getElementById('exploreList');

    async function loadExploreGuides() {
      list.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';

      const city = document.getElementById('filterCity').value;
      const language = document.getElementById('filterLanguage').value;
      const specialty = document.getElementById('filterSpecialty').value;
      const onlineOnly = document.getElementById('filterOnlineNow').checked;

      const guides = await fetchGuides({
        city: city !== 'all' ? city : null,
        language: language !== 'all' ? language : null,
        specialty: specialty !== 'all' ? specialty : null,
        onlineOnly,
        verifiedOnly: true
      });

      if (guides.length === 0) {
        list.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-title">${t('explore.noResultsTitle')}</div>
            <div class="empty-state-desc">${t('explore.noResultsDesc')}</div>
          </div>
        `;
        return;
      }

      list.innerHTML = guides.map(g => `
        <div class="guide-card">
          <div class="guide-card-top">
            <img src="${g.avatar}" alt="${g.name}" class="guide-avatar">
            <div class="guide-info">
              <div class="guide-name-row">
                <span class="guide-name">${g.name}</span>
                <span class="rating-pill">★ ${g.rating ? g.rating.toFixed(1) : '4.9'}</span>
              </div>
              <div class="guide-meta-inline">
                <span class="badge badge-verified">✓ ${t('search.verifiedBadge')}</span>
                <span>·</span>
                <span>${g.city || 'Cairo'}</span>
                <span>·</span>
                <span>${g.experienceYears || 1} ${t('search.yearsExp')}</span>
              </div>
              <div class="guide-languages">${Array.isArray(g.languages) ? g.languages.join(' · ') : g.languages}</div>
            </div>
          </div>
          <div class="guide-card-bottom">
            <div>
              <span class="guide-price-unit">${t('search.fromPrice')} </span>
              <span class="guide-price">$${g.hourlyRate}</span>
              <span class="guide-price-unit">${t('search.perHour')}</span>
            </div>
            <a href="/tourist/profile.html?id=${g.id}" class="btn btn-primary btn-sm">${t('search.viewProfile')}</a>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('filterCity').addEventListener('change', loadExploreGuides);
    document.getElementById('filterLanguage').addEventListener('change', loadExploreGuides);
    document.getElementById('filterSpecialty').addEventListener('change', loadExploreGuides);
    document.getElementById('filterOnlineNow').addEventListener('change', loadExploreGuides);

    document.addEventListener('tourguide:langchange', () => {
      loadExploreGuides();
    });

    loadExploreGuides();
  </script>
</body>
</html>
