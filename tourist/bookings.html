<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Bookings — TourGuide</title>
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/tourist.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="site-header">
    <div class="app-container header-inner">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
        </div>
        <span>TourGuide</span>
      </a>

      <nav class="nav-links">
        <a href="/tourist/index.html" class="nav-link" data-i18n="nav.home">Home</a>
        <a href="/tourist/explore.html" class="nav-link" data-i18n="nav.explore">Explore</a>
        <a href="/tourist/bookings.html" class="nav-link active" data-i18n="nav.bookings">Bookings</a>
        <a href="/guide/index.html" class="nav-link" data-i18n="nav.guidePortal">Guide Portal</a>
      </nav>

      <div class="header-actions"></div>
    </div>
  </header>

  <main class="main-content">
    <div class="app-container" style="max-width: 800px;">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-6);">
        <h1 style="font-size: 1.5rem; font-weight: 800;" data-i18n="booking.myBookingsTitle">My Tours & Bookings</h1>
        <a href="/tourist/index.html" class="btn btn-outline btn-sm" data-i18n="booking.findNewGuide">Find New Guide</a>
      </div>

      <!-- Bookings List -->
      <div id="bookingsListContainer" style="display: grid; gap: var(--space-4);">
        <!-- Rendered dynamically -->
      </div>

    </div>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="bottom-nav">
    <a href="/tourist/index.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
      <span data-i18n="nav.home">Home</span>
    </a>
    <a href="/tourist/explore.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span data-i18n="nav.explore">Explore</span>
    </a>
    <a href="/tourist/bookings.html" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      <span data-i18n="nav.bookings">Bookings</span>
    </a>
    <a href="/tourist/profile.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span data-i18n="nav.profile">Profile</span>
    </a>
  </nav>

  <script type="module">
    import { onAuthReady, enforceRouteProtection } from '/js/auth.js';
    import { getBookingsForTourist } from '/js/booking.js';
    import { t, getLocalizedStatus } from '/js/utils.js';

    enforceRouteProtection({ allowedRoles: ['tourist', 'admin'] });

    const container = document.getElementById('bookingsListContainer');

    async function renderUserBookings(user) {
      if (!user) return;
      container.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';

      try {
        const list = await getBookingsForTourist(user.uid);

        if (!list || list.length === 0) {
          container.innerHTML = `
            <div class="empty-state card">
              <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              <h2 class="empty-state-title">${t('booking.noBookingsTitle')}</h2>
              <p class="empty-state-desc">${t('booking.noBookingsDesc')}</p>
              <a href="/tourist/index.html" class="btn btn-primary btn-sm">${t('booking.findNewGuide')}</a>
            </div>
          `;
          return;
        }

        container.innerHTML = list.map(b => `
          <div class="card" style="display: flex; flex-direction: column; gap: var(--space-3);">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <span class="badge ${b.status === 'Tour Completed' ? 'badge-gray' : 'badge-online'}" style="margin-bottom: 6px;">
                  ${getLocalizedStatus(b.status)}
                </span>
                <h3 style="font-size: 1.05rem; font-weight: 700;">${b.location}</h3>
                <span style="font-size: 0.8rem; color: var(--text-muted);">${t('booking.guideLabel')}: ${b.guideName} · ${b.duration}</span>
              </div>
              <span style="font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums;">$${b.total}</span>
            </div>

            <div style="padding-top: var(--space-3); border-top: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 0.8rem; color: var(--text-secondary);">${b.date} · ${b.time || ''}</span>
              <a href="/tourist/booking.html?id=${b.id}" class="btn btn-outline btn-sm">
                ${b.status === 'Tour Completed' ? t('booking.viewDetails') : t('booking.trackTourBtn')}
              </a>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Bookings load error:', err);
        container.innerHTML = '<p style="color: var(--danger); text-align: center;">Failed to load bookings from Cloud Firestore.</p>';
      }
    }

    let currentUser = null;
    onAuthReady(async (user) => {
      currentUser = user;
      renderUserBookings(user);
    });

    document.addEventListener('tourguide:langchange', () => {
      if (currentUser) renderUserBookings(currentUser);
    });
  </script>
</body>
</html>
