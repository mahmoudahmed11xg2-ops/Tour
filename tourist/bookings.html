<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="app-root" content="../">
  <title>Bookings | TourGuide</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/tourist.css">
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js",
      "firebase/analytics": "https://www.gstatic.com/firebasejs/13.4.0/firebase-analytics.js"
    }
  }
  </script>
</head>
<body class="protected-page">

  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="./index.html" class="brand-wordmark">
          <span class="brand-mark" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
              <circle cx="12" cy="10" r="3"></circle>
              <path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 6.9 8 11.7z"></path>
            </svg>
          </span>
          <span data-i18n="brand.name">TourGuide</span>
        </a>
      </div>

      <nav class="header-nav" aria-label="Tourist Navigation">
        <a href="./index.html" class="nav-link" data-i18n="nav.home">Home</a>
        <a href="./explore.html" class="nav-link" data-i18n="nav.explore">Explore</a>
        <a href="./bookings.html" class="nav-link active" data-i18n="nav.bookings">Bookings</a>
        <a href="./messages.html" class="nav-link" data-i18n="nav.messages">Messages</a>
        <a href="./profile.html" class="nav-link" data-i18n="nav.profile">Profile</a>
      </nav>

      <div class="header-actions">
        <button type="button" class="lang-toggle-btn" aria-label="Toggle language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-label">English</span>
        </button>
        <span id="authHeaderSlot" class="auth-header-slot"></span>
      </div>
    </div>
  </header>

  <main class="container-narrow page-main">
    <div class="explore-toolbar">
      <h1 class="page-title" data-i18n="booking.myBookingsTitle">Bookings</h1>
      <a href="./index.html" class="btn btn-primary btn-sm" data-i18n="booking.findNewGuide">Find a Guide</a>
    </div>

    <div id="bookingsList" class="bookings-list"></div>
  </main>

  <nav class="bottom-nav" aria-label="Tourist Mobile Navigation">
    <a href="./index.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span data-i18n="nav.home">Home</span>
    </a>
    <a href="./explore.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span data-i18n="nav.explore">Explore</span>
    </a>
    <a href="./bookings.html" class="bottom-nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line></svg>
      <span data-i18n="nav.bookings">Bookings</span>
    </a>
    <a href="./messages.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      <span data-i18n="nav.messages">Messages</span>
    </a>
    <a href="./profile.html" class="bottom-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span data-i18n="nav.profile">Profile</span>
    </a>
  </nav>

  <script type="module">
    import { enforceRouteProtection, onAuthReady } from '../js/auth.js';
    import { getBookingsForTourist } from '../js/booking.js';
    import {
      applyTranslations,
      setupLanguageToggle,
      t,
      formatCurrency,
      formatBookingDateTime,
      formatDuration,
      getLocalizedStatus,
      escapeHtml
    } from '../js/utils.js';

    enforceRouteProtection({ allowedRoles: ['tourist'] });
    applyTranslations();
    setupLanguageToggle();

    let cachedBookings = [];

    function statusClass(st) {
      if (st === 'completed' || st === 'confirmed' || st === 'accepted') return 'status-success';
      if (st === 'cancelled' || st === 'rejected' || st === 'disputed') return 'status-danger';
      if (st === 'pending') return 'status-warning';
      return 'status-info';
    }

    function renderList() {
      const container = document.getElementById('bookingsList');
      if (!cachedBookings.length) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>${escapeHtml(t('booking.noBookingsTitle'))}</h3>
            <p>${escapeHtml(t('booking.noBookingsDesc'))}</p>
            <a href="./index.html" class="btn btn-primary">${escapeHtml(t('booking.findNewGuide'))}</a>
          </div>
        `;
        return;
      }

      container.innerHTML = cachedBookings.map(b => `
        <article class="booking-item-card">
          <div class="booking-item-head">
            <div>
              <h2 class="card-title">${escapeHtml(b.guideName || t('booking.guideLabel'))}</h2>
              <div class="meta-inline">
                <span class="tabular-nums">#${escapeHtml(b.id)}</span>
                <span class="meta-sep">&middot;</span>
                <span>${escapeHtml(b.location || '')}</span>
                <span class="meta-sep">&middot;</span>
                <span class="tabular-nums">${escapeHtml(formatDuration(b.duration))}</span>
              </div>
              <div class="meta-inline tabular-nums" style="margin-top:4px;">
                <span>${escapeHtml(formatBookingDateTime(b.date, b.startTime, b.endTime))}</span>
              </div>
            </div>
            <span class="status-label ${statusClass(b.status)}">${escapeHtml(getLocalizedStatus(b.status))}</span>
          </div>
          <div class="booking-item-actions" style="justify-content:space-between; align-items:center;">
            <strong class="tabular-nums">${formatCurrency(b.total || b.price || 0, b.currency || 'USD')}</strong>
            <div style="display:flex; gap:8px;">
              <a href="./messages.html?bookingId=${encodeURIComponent(b.id)}" class="btn btn-outline btn-sm">${escapeHtml(t('booking.chatWithGuide'))}</a>
              <a href="./booking.html?id=${encodeURIComponent(b.id)}" class="btn btn-primary btn-sm">${escapeHtml(t('booking.viewDetails'))}</a>
            </div>
          </div>
        </article>
      `).join('');
    }

    onAuthReady(async (user) => {
      if (!user) return;
      cachedBookings = await getBookingsForTourist(user.uid);
      renderList();
    });

    document.addEventListener('tourguide:langchange', renderList);
  </script>
</body>
</html>
